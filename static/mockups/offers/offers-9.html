<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offers 9 — Version 7 Brighter</title>
<link rel="stylesheet" href="boot.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f4f7f5;padding:30px}
    .wrap{max-width:1300px;margin:0 auto}

    /* ===== پس‌زمینه — نسخه ۷ ولی روشن‌تر ===== */
    .special-offers{
        background:#143526;border-radius:18px;padding:26px 22px;position:relative;
        box-shadow:0 18px 44px -18px rgba(14,40,30,.45);overflow:hidden;
    }
    .special-offers::before{
        content:"";position:absolute;inset:0;
        background:
            radial-gradient(circle at 90% 10%,rgba(46,204,143,.22),transparent 45%),
            radial-gradient(circle at 5% 100%,rgba(25,135,84,.18),transparent 40%);
        pointer-events:none;
    }
    .offers-header{
        display:flex;justify-content:space-between;align-items:center;
        margin-bottom:16px;position:relative;z-index:2;
    }
    .offers-title{
        display:flex;align-items:center;gap:14px;font-size:20px;font-weight:800;
        color:#e8f5ee;letter-spacing:.3px;
    }
    .offers-title .ic{
        width:40px;height:40px;border-radius:10px;
        background:linear-gradient(135deg,#2ecc8f,#1da165);color:#fff;
        display:flex;align-items:center;justify-content:center;font-size:17px;
        box-shadow:0 8px 18px -6px rgba(46,204,143,.5);
    }
    .offers-all{
        color:#2ecc8f;font-size:13px;font-weight:700;text-decoration:none;
        display:inline-flex;align-items:center;gap:6px;letter-spacing:.5px;
    }
    .offers-all:hover{text-decoration:underline}

    /* ===== تایمر — روشن‌تر ===== */
    .timer-bar{
        display:inline-flex;align-items:center;gap:9px;
        background:rgba(46,204,143,.15);border:1px solid rgba(46,204,143,.35);
        border-radius:30px;padding:6px 14px;margin-bottom:16px;position:relative;z-index:2;
    }
    .timer-bar i{color:#2ecc8f;font-size:13px}
    .timer-bar .lbl{font-size:11.5px;font-weight:700;color:#2ecc8f;margin-right:3px}
    .timer-box{
        background:rgba(0,0,0,.25);color:#2ecc8f;font-weight:800;font-size:12px;
        border-radius:6px;padding:4px 8px;min-width:34px;text-align:center;
    }
    .timer-box small{display:block;font-size:8.5px;color:#7a9c8a;font-weight:600;letter-spacing:1px}

    /* ===== ترک با دکمه‌های داخل ===== */
    .offers-track-wrap{position:relative;z-index:2;padding:0 46px}
    .offers-track{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;padding:4px 2px;scroll-behavior:smooth}
    .offers-track::-webkit-scrollbar{display:none}

    .nav-btn{
        position:absolute;top:50%;transform:translateY(-50%);
        width:36px;height:36px;border-radius:50%;z-index:4;
        background:rgba(46,204,143,.18);
        border:1px solid rgba(46,204,143,.5);
        color:#2ecc8f;font-size:13px;cursor:pointer;
        transition:opacity .3s,transform .3s,background .2s;
    }
    .nav-btn:hover{background:rgba(46,204,143,.35)}
    .nav-btn.prev{left:0}
    .nav-btn.next{right:0}
    .nav-btn.hidden{opacity:0;pointer-events:none;transform:translateY(-50%) scale(.8)}

    /* ===== کارت‌ها — تیره ولی روشن‌تر از ۷ ===== */
    .offer-card{
        flex:0 0 200px;
        background:linear-gradient(160deg,#1d3628,#1a3024);
        border:1px solid rgba(46,204,143,.2);
        border-radius:12px;padding:12px;position:relative;transition:.25s;cursor:pointer;
    }
    .offer-card:hover{transform:translateY(-4px);border-color:rgba(46,204,143,.45);box-shadow:0 14px 30px -12px rgba(0,0,0,.5)}
    .offer-tag{
        position:absolute;top:10px;left:10px;z-index:2;
        background:linear-gradient(135deg,#e6484d,#c92a2f);color:#fff;
        font-size:11px;font-weight:800;padding:4px 9px;border-radius:5px;
    }
    .offer-img{
        height:110px;background:rgba(255,255,255,.06);border-radius:9px;
        display:flex;align-items:center;justify-content:center;margin-bottom:10px;
    }
    .offer-img img{max-width:85%;max-height:100%;object-fit:contain}
    .offer-card h5{font-size:12.5px;font-weight:600;color:#c8d9cf;margin-bottom:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .offer-price{display:flex;align-items:baseline;gap:7px}
    .offer-price .new{font-size:16px;font-weight:800;color:#3ee6a0}
    .offer-price .old{font-size:12px;color:#718a7b;text-decoration:line-through}
</style>
</head>
<body>

<div class="wrap">
    <div class="special-offers">
        <div class="offers-header">
            <div class="offers-title">
                <span class="ic"><i class="fa-solid fa-bolt"></i></span>
                Flash Deals
            </div>
            <a href="#" class="offers-all">View All →</a>
        </div>

        <div class="timer-bar">
            <i class="fa-solid fa-clock"></i>
            <span class="lbl">Ends in</span>
            <span class="timer-box">02<small>HRS</small></span>
            <span class="timer-box">14<small>MIN</small></span>
            <span class="timer-box">36<small>SEC</small></span>
        </div>

        <div class="offers-track-wrap">
            <button class="nav-btn prev" id="prevBtn"><i class="fa-solid fa-chevron-left"></i></button>
            <div class="offers-track" id="track">
                <div class="offer-card"><span class="offer-tag">-10%</span><div class="offer-img"><img src="apple-iphone-16-pro-max_Natural%20Titanium.webp" alt=""></div><h5>iPhone 16 Pro Max</h5><div class="offer-price"><span class="new">$1,199</span><span class="old">$1,299</span></div></div>
                <div class="offer-card"><span class="offer-tag">-12%</span><div class="offer-img"><img src="xiaomi-15-pro_Black.webp" alt=""></div><h5>Xiaomi 15 Pro</h5><div class="offer-price"><span class="new">$699</span><span class="old">$799</span></div></div>
                <div class="offer-card"><span class="offer-tag">-14%</span><div class="offer-img"><img src="poco-f7-pro_Blue.webp" alt=""></div><h5>Poco F7 Pro</h5><div class="offer-price"><span class="new">$429</span><span class="old">$499</span></div></div>
                <div class="offer-card"><span class="offer-tag">-10%</span><div class="offer-img"><img src="msi-katana-15_Black.webp" alt=""></div><h5>MSI Katana 15</h5><div class="offer-price"><span class="new">$1,349</span><span class="old">$1,499</span></div></div>
                <div class="offer-card"><span class="offer-tag">-10%</span><div class="offer-img"><img src="lenovo-legion-5_Phantom%20Grey.webp" alt=""></div><h5>Lenovo Legion 5</h5><div class="offer-price"><span class="new">$1,249</span><span class="old">$1,399</span></div></div>
                <div class="offer-card"><span class="offer-tag">-11%</span><div class="offer-img"><img src="hp-pavilion-15_Silver.webp" alt=""></div><h5>HP Pavilion 15</h5><div class="offer-price"><span class="new">$799</span><span class="old">$899</span></div></div>
            </div>
            <button class="nav-btn next" id="nextBtn"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
    </div>
</div>

<script>
    const track = document.getElementById('track');
    const prev = document.getElementById('prevBtn');
    const next = document.getElementById('nextBtn');

    function updateBtns() {
        const maxScroll = track.scrollWidth - track.clientWidth;
        prev.classList.toggle('hidden', track.scrollLeft <= 5);
        next.classList.toggle('hidden', track.scrollLeft >= maxScroll - 5);
    }

    prev.addEventListener('click', () => track.scrollBy({left: -220, behavior:'smooth'}));
    next.addEventListener('click', () => track.scrollBy({left: 220, behavior:'smooth'}));
    track.addEventListener('scroll', updateBtns);
    window.addEventListener('resize', updateBtns);
    updateBtns();
</script>

</body>
</html>
