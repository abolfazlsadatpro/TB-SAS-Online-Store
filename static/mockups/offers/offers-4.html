<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offers 4 — White Minimal</title>
<link rel="stylesheet" href="boot.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f4f7f5;padding:30px}
    .wrap{max-width:1300px;margin:0 auto}

    .special-offers{
        background:#fff;border:1px solid #e8ede9;border-radius:16px;
        padding:24px 20px;position:relative;
        box-shadow:0 10px 30px -18px rgba(20,40,30,.15);
    }
    .offers-header{
        display:flex;justify-content:space-between;align-items:center;
        margin-bottom:20px;position:relative;z-index:2;
    }
    .offers-title{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;color:#1b2b22}
    .offers-title .ic{
        width:38px;height:38px;border-radius:10px;
        background:linear-gradient(135deg,#eaf6ef,#d6ecdf);color:#198754;
        display:flex;align-items:center;justify-content:center;font-size:16px;
    }
    .offers-title small{font-weight:400;font-size:12px;color:#8aa496}
    .offers-all{
        color:#198754;font-size:13px;font-weight:700;text-decoration:none;
        display:inline-flex;align-items:center;gap:6px;
    }
    .offers-all:hover{text-decoration:underline}
    .offers-nav{position:absolute;top:28px;right:20px;z-index:3;display:flex;gap:8px}
    .nav-btn{
        width:34px;height:34px;border-radius:9px;
        border:1px solid #d8e4dc;background:#fff;color:#198754;
        font-size:12px;cursor:pointer;transition:.2s;
    }
    .nav-btn:hover{background:#198754;color:#fff;border-color:#198754}

    .offers-track{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;padding:4px;position:relative;z-index:2}
    .offers-track::-webkit-scrollbar{display:none}

    .offer-card{
        flex:0 0 195px;background:#fafcfb;border:1px solid #eef1ef;
        border-radius:11px;padding:11px;position:relative;transition:.22s;cursor:pointer;
    }
    .offer-card:hover{border-color:#198754;transform:translateY(-3px);box-shadow:0 10px 22px -12px rgba(21,115,71,.25)}
    .offer-tag{
        position:absolute;top:9px;right:9px;z-index:2;
        background:#e63c3c;color:#fff;font-size:10.5px;font-weight:800;
        padding:3px 8px;border-radius:4px;
    }
    .offer-img{height:105px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:9px}
    .offer-img img{max-width:85%;max-height:100%;object-fit:contain}
    .offer-card h5{font-size:12px;font-weight:600;color:#3d4f46;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .offer-price{display:flex;align-items:baseline;gap:6px}
    .offer-price .new{font-size:15px;font-weight:800;color:#1b2b22}
    .offer-price .old{font-size:11.5px;color:#a9b5ae;text-decoration:line-through}
</style>
</head>
<body>

<div class="wrap">
    <div class="special-offers">
        <div class="offers-header">
            <div class="offers-title">
                <span class="ic"><i class="fa-solid fa-tags"></i></span>
                Today's Deals
                <small>· 6 products</small>
            </div>
            <a href="#" class="offers-all">View All →</a>
        </div>
        <div class="offers-nav">
            <button class="nav-btn"><i class="fa-solid fa-chevron-left"></i></button>
            <button class="nav-btn"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
        <div class="offers-track">
            <div class="offer-card"><span class="offer-tag">-10%</span><div class="offer-img"><img src="apple-iphone-16-pro-max_Natural%20Titanium.webp" alt=""></div><h5>iPhone 16 Pro Max</h5><div class="offer-price"><span class="new">$1,199</span><span class="old">$1,299</span></div></div>
            <div class="offer-card"><span class="offer-tag">-12%</span><div class="offer-img"><img src="xiaomi-15-pro_Black.webp" alt=""></div><h5>Xiaomi 15 Pro</h5><div class="offer-price"><span class="new">$699</span><span class="old">$799</span></div></div>
            <div class="offer-card"><span class="offer-tag">-14%</span><div class="offer-img"><img src="poco-f7-pro_Blue.webp" alt=""></div><h5>Poco F7 Pro</h5><div class="offer-price"><span class="new">$429</span><span class="old">$499</span></div></div>
            <div class="offer-card"><span class="offer-tag">-10%</span><div class="offer-img"><img src="msi-katana-15_Black.webp" alt=""></div><h5>MSI Katana 15</h5><div class="offer-price"><span class="new">$1,349</span><span class="old">$1,499</span></div></div>
            <div class="offer-card"><span class="offer-tag">-10%</span><div class="offer-img"><img src="lenovo-legion-5_Phantom%20Grey.webp" alt=""></div><h5>Lenovo Legion 5</h5><div class="offer-price"><span class="new">$1,249</span><span class="old">$1,399</span></div></div>
            <div class="offer-card"><span class="offer-tag">-11%</span><div class="offer-img"><img src="hp-pavilion-15_Silver.webp" alt=""></div><h5>HP Pavilion 15</h5><div class="offer-price"><span class="new">$799</span><span class="old">$899</span></div></div>
        </div>
    </div>
</div>

</body>
</html>
