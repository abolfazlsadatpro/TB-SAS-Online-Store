<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offers 2 — Dark Premium</title>
<link rel="stylesheet" href="boot.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f4f7f5;padding:30px}
    .wrap{max-width:1300px;margin:0 auto}

    .special-offers{
        background:#0f1f17;border-radius:18px;padding:26px 22px;position:relative;
        box-shadow:0 18px 44px -18px rgba(0,0,0,.5);overflow:hidden;
    }
    .special-offers::before{
        content:"";position:absolute;inset:0;
        background:
            radial-gradient(circle at 90% 10%,rgba(46,204,143,.15),transparent 40%),
            radial-gradient(circle at 5% 100%,rgba(25,135,84,.12),transparent 40%);
    }
    .offers-header{
        display:flex;justify-content:space-between;align-items:center;
        margin-bottom:22px;position:relative;z-index:2;color:#fff;
    }
    .offers-title{
        display:flex;align-items:center;gap:14px;font-size:20px;font-weight:800;
        letter-spacing:.3px;
    }
    .offers-title .ic{
        width:40px;height:40px;border-radius:10px;
        background:linear-gradient(135deg,#2ecc8f,#1da165);color:#fff;
        display:flex;align-items:center;justify-content:center;font-size:17px;
        box-shadow:0 8px 18px -6px rgba(46,204,143,.5);
    }
    .offers-title small{font-weight:400;font-size:12px;opacity:.6;margin-left:6px;letter-spacing:0}
    .offers-all{
        color:#2ecc8f;font-size:13px;font-weight:700;text-decoration:none;
        display:inline-flex;align-items:center;gap:6px;letter-spacing:.5px;
    }
    .offers-all:hover{text-decoration:underline}

    .offers-nav{position:absolute;top:30px;right:22px;z-index:3;display:flex;gap:8px}
    .nav-btn{
        width:34px;height:34px;border-radius:9px;
        border:1px solid rgba(46,204,143,.4);background:rgba(46,204,143,.1);
        color:#2ecc8f;font-size:12px;cursor:pointer;transition:.2s;
    }
    .nav-btn:hover{background:#2ecc8f;color:#0f1f17}

    .offers-track{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;padding:4px;position:relative;z-index:2}
    .offers-track::-webkit-scrollbar{display:none}

    .offer-card{
        flex:0 0 205px;background:#14251c;border:1px solid rgba(46,204,143,.15);
        border-radius:12px;padding:12px;position:relative;transition:.25s;cursor:pointer;
    }
    .offer-card:hover{transform:translateY(-4px);border-color:rgba(46,204,143,.4);box-shadow:0 14px 30px -12px rgba(0,0,0,.6)}
    .offer-tag{
        position:absolute;top:10px;left:10px;z-index:2;
        background:linear-gradient(135deg,#e6484d,#c92a2f);color:#fff;
        font-size:11px;font-weight:800;padding:4px 9px;border-radius:5px;
    }
    .offer-img{height:115px;background:#0d1a13;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
    .offer-img img{max-width:85%;max-height:100%;object-fit:contain}
    .offer-card h5{font-size:12.5px;font-weight:600;color:#b8c9bf;margin-bottom:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .offer-price{display:flex;align-items:baseline;gap:7px}
    .offer-price .new{font-size:16px;font-weight:800;color:#2ecc8f}
    .offer-price .old{font-size:12px;color:#5a6b62;text-decoration:line-through}
    .offer-cart{
        width:100%;margin-top:10px;padding:8px;border:none;border-radius:8px;
        background:rgba(46,204,143,.1);color:#2ecc8f;font-weight:700;font-size:12px;
        cursor:pointer;transition:.2s;
    }
    .offer-cart:hover{background:#2ecc8f;color:#0f1f17}
</style>
</head>
<body>

<div class="wrap">
    <div class="special-offers">
        <div class="offers-header">
            <div class="offers-title">
                <span class="ic"><i class="fa-solid fa-bolt"></i></span>
                Flash Deals
                <small>· Limited time</small>
            </div>
            <a href="#" class="offers-all">View All →</a>
        </div>
        <div class="offers-nav">
            <button class="nav-btn"><i class="fa-solid fa-chevron-left"></i></button>
            <button class="nav-btn"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
        <div class="offers-track">
            <div class="offer-card"><span class="offer-tag">-10%</span><div class="offer-img"><img src="apple-iphone-16-pro-max_Natural%20Titanium.webp" alt=""></div><h5>iPhone 16 Pro Max</h5><div class="offer-price"><span class="new">$1,199</span><span class="old">$1,299</span></div><button class="offer-cart"><i class="fa-solid fa-cart-plus"></i> Add to Cart</button></div>
            <div class="offer-card"><span class="offer-tag">-12%</span><div class="offer-img"><img src="xiaomi-15-pro_Black.webp" alt=""></div><h5>Xiaomi 15 Pro</h5><div class="offer-price"><span class="new">$699</span><span class="old">$799</span></div><button class="offer-cart"><i class="fa-solid fa-cart-plus"></i> Add to Cart</button></div>
            <div class="offer-card"><span class="offer-tag">-14%</span><div class="offer-img"><img src="poco-f7-pro_Blue.webp" alt=""></div><h5>Poco F7 Pro</h5><div class="offer-price"><span class="new">$429</span><span class="old">$499</span></div><button class="offer-cart"><i class="fa-solid fa-cart-plus"></i> Add to Cart</button></div>
            <div class="offer-card"><span class="offer-tag">-10%</span><div class="offer-img"><img src="msi-katana-15_Black.webp" alt=""></div><h5>MSI Katana 15</h5><div class="offer-price"><span class="new">$1,349</span><span class="old">$1,499</span></div><button class="offer-cart"><i class="fa-solid fa-cart-plus"></i> Add to Cart</button></div>
            <div class="offer-card"><span class="offer-tag">-10%</span><div class="offer-img"><img src="lenovo-legion-5_Phantom%20Grey.webp" alt=""></div><h5>Lenovo Legion 5</h5><div class="offer-price"><span class="new">$1,249</span><span class="old">$1,399</span></div><button class="offer-cart"><i class="fa-solid fa-cart-plus"></i> Add to Cart</button></div>
            <div class="offer-card"><span class="offer-tag">-11%</span><div class="offer-img"><img src="hp-pavilion-15_Silver.webp" alt=""></div><h5>HP Pavilion 15</h5><div class="offer-price"><span class="new">$799</span><span class="old">$899</span></div><button class="offer-cart"><i class="fa-solid fa-cart-plus"></i> Add to Cart</button></div>
        </div>
    </div>
</div>

</body>
</html>
