<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offers 1 — Classic Flash</title>
<link rel="stylesheet" href="boot.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f4f7f5;padding:30px}
    .wrap{max-width:1300px;margin:0 auto}

    /* ===== SECTION — Classic Flash ===== */
    .special-offers-section{
        background:linear-gradient(135deg,#0b5134,#16a34a);
        border-radius:16px;padding:24px 20px;position:relative;overflow:hidden;
        box-shadow:0 18px 40px -18px rgba(10,77,51,.45);
    }
    .special-offers-section::before{
        content:"";position:absolute;top:-80px;right:-50px;
        width:260px;height:260px;border-radius:50%;
        background:radial-gradient(circle,rgba(255,255,255,.08),transparent 65%);
    }
    .offers-header{
        display:flex;justify-content:space-between;align-items:center;
        margin-bottom:20px;position:relative;z-index:2;color:#fff;
    }
    .offers-title{
        display:flex;align-items:center;gap:12px;font-size:20px;font-weight:800;
    }
    .offers-title .fire{color:#ffd166}
    .offers-title small{font-weight:400;font-size:12px;opacity:.7;margin-left:6px}
    .offers-timer{
        display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.2);
        padding:8px 14px;border-radius:8px;font-size:13px;font-weight:700;
    }
    .offers-timer i{color:#ffd166}
    .offers-all{color:rgba(255,255,255,.85);font-size:13px;font-weight:600;text-decoration:none}
    .offers-all:hover{text-decoration:underline}

    .offers-nav{position:absolute;top:26px;right:20px;z-index:3;display:flex;gap:8px}
    .nav-btn{
        width:34px;height:34px;border-radius:50%;
        border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.15);
        color:#fff;font-size:12px;cursor:pointer;transition:.2s;
    }
    .nav-btn:hover{background:rgba(255,255,255,.3)}

    .offers-track{
        display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;
        padding:4px;position:relative;z-index:2;
    }
    .offers-track::-webkit-scrollbar{display:none}

    .offer-card{
        flex:0 0 200px;background:#fff;border-radius:12px;padding:12px;
        position:relative;transition:.25s;cursor:pointer;
    }
    .offer-card:hover{transform:translateY(-4px);box-shadow:0 14px 28px -12px rgba(0,0,0,.35)}
    .offer-tag{
        position:absolute;top:10px;left:10px;z-index:2;
        background:#e63c3c;color:#fff;font-size:11px;font-weight:800;
        padding:4px 9px;border-radius:5px;
        box-shadow:0 4px 10px -3px rgba(230,60,60,.5);
    }
    .offer-img{
        height:115px;background:#fafcfb;border-radius:9px;
        display:flex;align-items:center;justify-content:center;margin-bottom:10px;
    }
    .offer-img img{max-width:85%;max-height:100%;object-fit:contain}
    .offer-card h5{
        font-size:12.5px;font-weight:600;color:#3d4f46;
        margin-bottom:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .offer-price{display:flex;align-items:baseline;gap:7px}
    .offer-price .new{font-size:16px;font-weight:800;color:#1b2b22}
    .offer-price .old{font-size:12px;color:#a9b5ae;text-decoration:line-through}
</style>
</head>
<body>

<div class="wrap">

    <div class="special-offers">
        <div class="offers-header">
            <div class="offers-title">
                <i class="fa-solid fa-fire-fire-burner fire"></i>
                Flash Deals
                <span>· New discounts daily</span>
            </div>
            <a href="#" class="offers-all">View All →</a>
        </div>
        <div class="offers-nav">
            <button class="nav-btn"><i class="fa-solid fa-chevron-left"></i></button>
            <button class="nav-btn"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
        <div class="offers-track">
            <div class="offer-card"><span class="offer-tag">-10%</span><div class="offer-img"><img src="apple-iphone-16-pro-max_Natural%20Titanium.webp" alt=""></div><h5>iPhone 16 Pro Max</h5><div class="offer-price"><span class="new">$1,199</span><span class="old">$1,299</span></div></div>
            <div class="offer-card"><span class="offer-tag">-12%</span><div class="offer-img"><img src="xiaomi-15-pro_Black.webp" alt=""></div><h5>Xiaomi 15 Pro</h5><div class="offer-price"><span class="new">$699</span><span class="old">$799</span></div></div>
            <div class="offer-card"><span class="offer-tag">-14%</span><div class="offer-img"><img src="poco-f7-pro_Blue.webp" alt=""></div><h5>Poco F7 Pro</h5><div class="offer-price"><span class="new">$429</span><span class="old">$499</span></div></div>
            <div class="offer-card"><span class="offer-tag">-10%</span><div class="offer-img"><img src="msi-katana-15_Black.webp" alt=""></div><h5>MSI Katana 15</h5><div class="offer-price"><span class="new">$1,349</span><span class="old">$1,499</span></div></div>
            <div class="offer-card"><span class="offer-tag">-10%</span><div class="offer-img"><img src="lenovo-legion-5_Phantom%20Grey.webp" alt=""></div><h5>Lenovo Legion 5</h5><div class="offer-price"><span class="new">$1,249</span><span class="old">$1,399</span></div></div>
            <div class="offer-card"><span class="offer-tag">-11%</span><div class="offer-img"><img src="hp-pavilion-15_Silver.webp" alt=""></div><h5>HP Pavilion 15</h5><div class="offer-price"><span class="new">$799</span><span class="old">$899</span></div></div>
        </div>
    </div>

</div>

</body>
</html>
