<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Brands — Lux Gold</title>
<link rel="stylesheet" href="boot.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',Tahoma,sans-serif;background:#0e1511;padding:30px;min-height:100vh}
    .wrap{max-width:1300px;margin:0 auto}

    .brand-section{
        background:
            radial-gradient(900px 320px at 85% -20%, rgba(212,175,55,.10), transparent 60%),
            radial-gradient(700px 280px at 8% 115%, rgba(212,175,55,.05), transparent 55%),
            #101a15;
        border:1px solid rgba(212,175,55,.22);
        border-radius:20px;padding:28px;position:relative;overflow:hidden;
        box-shadow:0 26px 60px -26px rgba(0,0,0,.7);
    }
    .brand-section::after{
        content:"";position:absolute;inset:0;pointer-events:none;
        background:linear-gradient(180deg,transparent,rgba(212,175,55,.028) 55%,transparent);
    }

    .brand-title{
        display:flex;align-items:center;gap:14px;margin-bottom:24px;position:relative;z-index:2;
    }
    .brand-title h3{
        font-family:'Playfair Display','Georgia',serif;
        font-size:27px;font-weight:700;letter-spacing:.5px;margin:0;
        background:linear-gradient(95deg,#f7e7b3 5%,#d4af37 48%,#a8852d 95%);
        -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    }
    .brand-title .bar{
        flex:0 0 46px;height:2px;
        background:linear-gradient(90deg,#d4af37,rgba(212,175,55,0));
    }
    .brand-title .count{
        margin-left:auto;font-size:11px;letter-spacing:3px;color:rgba(212,175,55,.6);
        text-transform:uppercase;
    }

    .brand-slider-wrapper{position:relative;z-index:2;padding:0 8px}
    .brand-slider{display:flex;overflow:hidden;transition:transform .45s cubic-bezier(.22,.9,.3,1)}
    .brand-item{
        flex:0 0 calc(100%/6);
        height:66px;display:flex;align-items:center;justify-content:center;
        padding:10px;position:relative;text-decoration:none;
        border:1px solid rgba(212,175,55,.14);border-radius:12px;
        background:rgba(255,255,255,.02);margin-right:12px;transition:.25s;
    }
    .brand-item::after{
        content:"";position:absolute;left:0;right:0;bottom:0;height:2px;
        background:linear-gradient(90deg,transparent,#d4af37,transparent);
        transform:scaleX(0);transform-origin:center;transition:transform .3s;
    }
    .brand-item:hover{background:rgba(212,175,55,.06);border-color:rgba(212,175,55,.4)}
    .brand-item:hover::after{transform:scaleX(1)}
    .brand-item img{
        max-width:82%;max-height:70%;object-fit:contain;transition:.3s;
        filter:grayscale(1) invert(1) brightness(1.9);
    }
    .brand-item:hover img{
        filter:grayscale(0) invert(0) brightness(1.05);
        transform:scale(1.1);
        filter:grayscale(0) invert(0) brightness(1.1) drop-shadow(0 0 12px rgba(212,175,55,.65));
    }

    .bbtn{
        position:absolute;top:50%;transform:translateY(-50%);z-index:6;
        width:38px;height:38px;border-radius:50%;
        background:rgba(16,26,21,.85);border:1px solid rgba(212,175,55,.4);
        color:#d4af37;font-size:13px;cursor:pointer;transition:.25s;
        display:flex;align-items:center;justify-content:center;
        -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    }
    .bbtn:hover{
        background:linear-gradient(135deg,#f7e7b3,#d4af37);
        color:#101a15;border-color:transparent;
        box-shadow:0 0 22px rgba(212,175,55,.45);
    }
    .bbtn.left{left:-14px}
    .bbtn.right{right:-14px}
    .bbtn.disabled{opacity:.25;pointer-events:none}

    @media(max-width:768px){ .brand-item{flex-basis:33.33%} }
    @media(max-width:480px){ .brand-item{flex-basis:50%} }
</style>
</head>
<body>
<div class="wrap">
    <div class="brand-section">
        <div class="brand-title">
            <h3>Top Brands</h3>
            <span class="bar"></span>
            <span class="count">10 Brands</span>
        </div>
        <div class="brand-slider-wrapper">
            <button class="bbtn left" id="pv"><i class="fa-solid fa-chevron-left"></i></button>
            <div class="brand-slider" id="tr">
                <a href="#" class="brand-item"><img src="Logo_SAMSUNG.webp" alt="Samsung"></a>
                <a href="#" class="brand-item"><img src="Logo_Apple.webp" alt="Apple"></a>
                <a href="#" class="brand-item"><img src="Logo_Xiaomi.webp" alt="Xiaomi"></a>
                <a href="#" class="brand-item"><img src="Logo_NOKIA.webp" alt="Nokia"></a>
                <a href="#" class="brand-item"><img src="Logo_AUSU.webp" alt="ASUS"></a>
                <a href="#" class="brand-item"><img src="Logo_JBL.webp" alt="JBL"></a>
                <a href="#" class="brand-item"><img src="Logo_SONY.webp" alt="Sony"></a>
                <a href="#" class="brand-item"><img src="Logo_LG.webp" alt="LG"></a>
                <a href="#" class="brand-item"><img src="Logo_HUAWEl.webp" alt="Huawei"></a>
                <a href="#" class="brand-item"><img src="Logo_TP-LINK.webp" alt="TP-Link"></a>
            </div>
            <button class="bbtn right" id="nx"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
    </div>
</div>

<script>
    const tr = document.getElementById('tr'), pv = document.getElementById('pv'), nx = document.getElementById('nx');
    let idx = 0;
    const per = (tr.clientWidth > 0 && tr.children[0].getBoundingClientRect().width > 0)
        ? Math.max(1, Math.round(tr.clientWidth / tr.children[0].getBoundingClientRect().width)) : 6;
    const max = tr.children.length - per;
    function update(){
        if (idx > max) idx = max;
        tr.style.transform = 'translateX(-' + (idx * (100/per)) + '%)';
        pv.classList.toggle('disabled', idx <= 0);
        nx.classList.toggle('disabled', idx >= max);
    }
    pv.onclick = () => { if (idx > 0){ idx--; update(); } };
    nx.onclick = () => { if (idx < max){ idx++; update(); } };
    window.addEventListener('resize', update);
    update();
</script>
</body>
</html>
