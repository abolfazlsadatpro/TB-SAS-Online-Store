<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Brands — 3D Special</title>
<link rel="stylesheet" href="boot.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f4f7f5;padding:30px}
    .wrap{max-width:1300px;margin:0 auto}

    /* ===== کارت اصلی ===== */
    .brand-section{
        background:linear-gradient(160deg,#ffffff,#f6faf7);
        border:1px solid #e8ede9;border-radius:20px;
        padding:26px;position:relative;overflow:hidden;
        box-shadow:0 16px 40px -20px rgba(13,62,41,.18);
    }
    .brand-section::before{
        content:"";position:absolute;top:-80px;right:-60px;
        width:220px;height:220px;border-radius:50%;
        background:radial-gradient(circle,rgba(25,135,84,.06),transparent 60%);
    }

    /* ===== عنوان سه‌بعدی ===== */
    .brand-title{
        display:flex;align-items:center;gap:14px;margin-bottom:22px;
        position:relative;z-index:2;
    }
    .brand-title h3{
        font-size:24px;font-weight:900;color:#0b5134;margin:0;
        letter-spacing:-.5px;
        text-shadow:
            2px 2px 0 rgba(25,135,84,.35),
            4px 4px 0 rgba(25,135,84,.15),
            8px 10px 18px rgba(13,62,41,.25);
    }
    /* تیک سه‌بعدی */
    .brand-title .tick{
        width:38px;height:38px;border-radius:11px;
        background:linear-gradient(145deg,#27a06b,#157347);
        display:flex;align-items:center;justify-content:center;
        color:#fff;font-size:18px;
        box-shadow:
            0 1px 0 rgba(255,255,255,.4) inset,
            0 12px 22px -8px rgba(21,115,71,.6),
            0 5px 0 #0d5031;
        transform:rotate(-4deg);
        transition:.3s;
    }
    .brand-title:hover .tick{
        transform:rotate(0deg) scale(1.08);
    }

    /* ===== نوار برندها ===== */
    .brand-slider-wrapper{position:relative}
    .brand-slider{display:flex;overflow:hidden;transition:transform .45s cubic-bezier(.22,.9,.3,1)}
    .brand-item{
        flex:0 0 calc(100%/6);
        height:64px;display:flex;align-items:center;justify-content:center;
        position:relative;text-decoration:none;padding:8px;
        transition:.22s;
    }
    /* خط نازک بین برندها */
    .brand-item::after{
        content:"";position:absolute;right:0;top:15%;bottom:15%;
        width:1px;background:linear-gradient(180deg,transparent,#d8e8de,transparent);
    }
    .brand-item:last-child::after{display:none}
    .brand-item img{
        max-width:80%;max-height:55px;object-fit:contain;
        opacity:.75;transition:.25s;
    }
    .brand-item:hover{background:rgba(25,135,84,.04)}
    .brand-item:hover img{opacity:1;transform:scale(1.12)}

    /* دکمه‌ها — بیرون و شیشه‌ای */
    .bbtn{
        position:absolute;top:50%;transform:translateY(-50%);z-index:5;
        width:36px;height:36px;border-radius:50%;
        background:rgba(255,255,255,.9);border:1px solid #cfe5d8;color:#198754;
        font-size:13px;cursor:pointer;transition:.25s;
        display:flex;align-items:center;justify-content:center;
        box-shadow:
            0 1px 0 #fff inset,
            0 8px 18px -8px rgba(13,62,41,.25),
            0 4px 0 #d8e8de;
    }
    .bbtn:hover{
        background:linear-gradient(145deg,#27a06b,#157347);
        color:#fff;border-color:transparent;
        box-shadow:
            0 1px 0 rgba(255,255,255,.4) inset,
            0 10px 22px -8px rgba(21,115,71,.5),
            0 5px 0 #0d5031;
        transform:translateY(-50%) scale(1.05);
    }
    .bbtn.left{left:-12px}
    .bbtn.right{right:-12px}
    .bbtn.disabled{opacity:.25;pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
    <div class="brand-section">
        <div class="brand-title">
            <span class="tick"><i class="fa-solid fa-check-double"></i></span>
            <h3>Top Brands</h3>
        </div>
        <div class="brand-slider-wrapper">
            <button class="bbtn left" id="pv"><i class="fa-solid fa-chevron-left"></i></button>
            <div class="brand-slider" id="tr">
                <a href="#" class="brand-item"><img src="Logo_SAMSUNG.webp" alt="Samsung"></a>
                <a href="#" class="brand-item"><img src="Logo_Apple.webp" alt="Apple"></a>
                <a href="#" class="brand-item"><img src="Logo_Xiaomi.webp" alt="Xiaomi"></a>
                <a href="#" class="brand-item"><img src="Logo_NOKIA.webp" alt="Nokia"></a>
                <a href="#" class="brand-item"><img src="Logo_AUSU.webp" alt="ASUS"></a>
                <a href="#" class="brand-item"><img src="Logo_JBL.webp" alt="JBL"></a>
                <a href="#" class="brand-item"><img src="Logo_SONY.webp" alt="Sony"></a>
                <a href="#" class="brand-item"><img src="Logo_LG.webp" alt="LG"></a>
                <a href="#" class="brand-item"><img src="Logo_HUAWEl.webp" alt="Huawei"></a>
                <a href="#" class="brand-item"><img src="Logo_TP-LINK.webp" alt="TP-Link"></a>
            </div>
            <button class="bbtn right" id="nx"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
    </div>
</div>

<script>
    const tr = document.getElementById('tr'), pv = document.getElementById('pv'), nx = document.getElementById('nx');
    const per = 6; let idx = 0; const max = tr.children.length - per;
    function update(){
        tr.style.transform = 'translateX(-' + (idx * (100/per)) + '%)';
        pv.classList.toggle('disabled', idx <= 0);
        nx.classList.toggle('disabled', idx >= max);
    }
    pv.onclick = () => { if(idx > 0){ idx--; update(); } };
    nx.onclick = () => { if(idx < max){ idx++; update(); } };
    update();
</script>
</body>
</html>
