<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Brands — Editorial</title>
<link rel="stylesheet" href="boot.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',Tahoma,sans-serif;background:#faf9f6;padding:30px;min-height:100vh}
    .wrap{max-width:1300px;margin:0 auto}

    .brand-section{
        background:#fff;border:1px solid #e7e3da;border-radius:6px;
        padding:24px 26px;position:relative;
        box-shadow:0 4px 16px -12px rgba(40,35,25,.12);
    }

    .brand-title{
        display:flex;align-items:baseline;gap:14px;margin-bottom:18px;
        padding-bottom:12px;border-bottom:1px solid #e7e3da;
    }
    .brand-title h3{
        font-family:'Playfair Display','Georgia',serif;
        font-size:22px;font-weight:700;color:#141414;margin:0;letter-spacing:-.2px;
    }
    .brand-title .rule{
        flex:1;height:1px;
        background:linear-gradient(90deg,#d9d4c8,transparent);
    }
    .brand-title .tag{
        font-size:10px;letter-spacing:2.5px;color:#8a8478;text-transform:uppercase;
    }

    .brand-slider-wrapper{position:relative}
    .brand-slider{display:flex;overflow:hidden;transition:transform .45s cubic-bezier(.22,.9,.3,1)}
    .brand-item{
        flex:0 0 calc(100%/6);
        height:56px;display:flex;align-items:center;justify-content:center;
        padding:8px;text-decoration:none;
        border-bottom:1px solid #e7e3da;transition:.2s;
    }
    .brand-item:hover{border-bottom-color:#141414;background:#faf9f6}
    .brand-item img{
        max-width:82%;max-height:68%;object-fit:contain;
        filter:grayscale(1);opacity:.72;transition:.25s;
    }
    .brand-item:hover img{filter:grayscale(0);opacity:1}

    .bbtn{
        position:absolute;top:50%;transform:translateY(-50%);z-index:6;
        width:34px;height:34px;border-radius:50%;
        background:#fff;border:1px solid #d9d4c8;color:#141414;
        font-size:12px;cursor:pointer;transition:.2s;
        display:flex;align-items:center;justify-content:center;
    }
    .bbtn:hover{background:#141414;color:#fff;border-color:#141414}
    .bbtn.left{left:-16px}
    .bbtn.right{right:-16px}
    .bbtn.disabled{opacity:.3;pointer-events:none}

    @media(max-width:768px){ .brand-item{flex-basis:33.33%} }
    @media(max-width:480px){ .brand-item{flex-basis:50%} }
</style>
</head>
<body>
<div class="wrap">
    <div class="brand-section">
        <div class="brand-title">
            <h3>Top Brands</h3>
            <span class="rule"></span>
            <span class="tag">Section 01</span>
        </div>
        <div class="brand-slider-wrapper">
            <button class="bbtn left" id="pv"><i class="fa-solid fa-chevron-left"></i></button>
            <div class="brand-slider" id="tr">
                <a href="#" class="brand-item"><img src="Logo_SAMSUNG.webp" alt="Samsung"></a>
                <a href="#" class="brand-item"><img src="Logo_Apple.webp" alt="Apple"></a>
                <a href="#" class="brand-item"><img src="Logo_Xiaomi.webp" alt="Xiaomi"></a>
                <a href="#" class="brand-item"><img src="Logo_NOKIA.webp" alt="Nokia"></a>
                <a href="#" class="brand-item"><img src="Logo_AUSU.webp" alt="ASUS"></a>
                <a href="#" class="brand-item"><img src="Logo_JBL.webp" alt="JBL"></a>
                <a href="#" class="brand-item"><img src="Logo_SONY.webp" alt="Sony"></a>
                <a href="#" class="brand-item"><img src="Logo_LG.webp" alt="LG"></a>
                <a href="#" class="brand-item"><img src="Logo_HUAWEl.webp" alt="Huawei"></a>
                <a href="#" class="brand-item"><img src="Logo_TP-LINK.webp" alt="TP-Link"></a>
            </div>
            <button class="bbtn right" id="nx"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
    </div>
</div>

<script>
    const tr = document.getElementById('tr'), pv = document.getElementById('pv'), nx = document.getElementById('nx');
    let idx = 0;
    const per = (tr.clientWidth > 0 && tr.children[0].getBoundingClientRect().width > 0)
        ? Math.max(1, Math.round(tr.clientWidth / tr.children[0].getBoundingClientRect().width)) : 6;
    const max = tr.children.length - per;
    function update(){
        if (idx > max) idx = max;
        tr.style.transform = 'translateX(-' + (idx * (100/per)) + '%)';
        pv.classList.toggle('disabled', idx <= 0);
        nx.classList.toggle('disabled', idx >= max);
    }
    pv.onclick = () => { if (idx > 0){ idx--; update(); } };
    nx.onclick = () => { if (idx < max){ idx++; update(); } };
    window.addEventListener('resize', update);
    update();
</script>
</body>
</html>
