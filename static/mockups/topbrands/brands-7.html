<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Brands 3 — Outline Glass</title>
<link rel="stylesheet" href="boot.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f4f7f5;padding:30px}
    .wrap{max-width:1300px;margin:0 auto}

    .brand-section{
        background:#fff;border:1px solid #e8ede9;border-radius:18px;
        padding:24px;position:relative;overflow:hidden;
        box-shadow:0 14px 34px -20px rgba(13,62,41,.12);
    }
    .brand-title{
        display:flex;align-items:center;gap:12px;margin-bottom:20px;
    }
    /* عنوان با خط زیر */
    .brand-title h3{
        font-size:20px;font-weight:800;color:#1b2b22;margin:0;
        position:relative;padding-bottom:8px;
    }
    .brand-title h3::after{
        content:"";position:absolute;left:0;bottom:0;width:44px;height:3px;
        background:linear-gradient(90deg,#198754,#9fe3bd);border-radius:3px;
    }
    .brand-title i{color:#198754;font-size:19px}

    .brand-slider-wrapper{position:relative}
    .brand-slider{display:flex;overflow:hidden;transition:transform .45s cubic-bezier(.22,.9,.3,1)}
    .brand-item{
        flex:0 0 calc(100%/6);
        height:58px;display:flex;align-items:center;justify-content:center;
        border:1px solid #edf1ee;border-radius:10px;margin-right:10px;
        transition:.25s;text-decoration:none;
    }
    .brand-item:hover{border-color:#198754;box-shadow:0 8px 18px -10px rgba(21,115,71,.25)}
    .brand-item img{max-width:78%;max-height:42px;object-fit:contain}

    .bbtn{
        position:absolute;top:42%;transform:translateY(-50%);z-index:5;
        width:36px;height:36px;border-radius:50%;
        background:#fff;border:1px solid #d8e4dc;color:#198754;
        font-size:13px;cursor:pointer;transition:.25s;
        display:flex;align-items:center;justify-content:center;
        box-shadow:0 4px 12px -6px rgba(20,40,30,.25);
    }
    .bbtn:hover{background:#198754;color:#fff;border-color:#198754}
    .bbtn.left{left:6px}
    .bbtn.right{right:6px}
    .bbtn.disabled{opacity:.25;pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
    <div class="brand-section">
        <div class="brand-title">
            <i class="fa-solid fa-circle-check"></i>
            <h3>Top Brands</h3>
        </div>
        <div class="brand-slider-wrapper">
            <button class="bbtn left" id="pv"><i class="fa-solid fa-chevron-left"></i></button>
            <div class="brand-slider" id="tr">
                <a href="#" class="brand-item"><img src="Logo_SAMSUNG.webp"></a>
                <a href="#" class="brand-item"><img src="Logo_Apple.webp"></a>
                <a href="#" class="brand-item"><img src="Logo_Xiaomi.webp"></a>
                <a href="#" class="brand-item"><img src="Logo_NOKIA.webp"></a>
                <a href="#" class="brand-item"><img src="Logo_AUSU.webp"></a>
                <a href="#" class="brand-item"><img src="Logo_JBL.webp"></a>
                <a href="#" class="brand-item"><img src="Logo_SONY.webp"></a>
                <a href="#" class="brand-item"><img src="Logo_LG.webp"></a>
                <a href="#" class="brand-item"><img src="Logo_HUAWEl.webp"></a>
                <a href="#" class="brand-item"><img src="Logo_TP-LINK.webp"></a>
            </div>
            <button class="bbtn right" id="nx"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
    </div>
</div>

<script>
    const tr = document.getElementById('tr'), pv = document.getElementById('pv'), nx = document.getElementById('nx');
    const per = 6; let idx = 0; const max = tr.children.length - per;
    function update(){
        tr.style.transform = 'translateX(-' + (idx * (100/per)) + '%)';
        pv.classList.toggle('disabled', idx <= 0);
        nx.classList.toggle('disabled', idx >= max);
    }
    pv.onclick = () => { if(idx > 0){ idx--; update(); } };
    nx.onclick = () => { if(idx < max){ idx++; update(); } };
    update();
</script>
</body>
</html>
