<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Brands — Circuit</title>
<link rel="stylesheet" href="boot.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f2f7f2;padding:30px;min-height:100vh}
    .wrap{max-width:1300px;margin:0 auto}

    .brand-section{
        background:
            radial-gradient(500px 160px at 95% -10%, rgba(25,135,84,.07), transparent 60%),
            linear-gradient(160deg,#ffffff,#f0f7f2);
        border:1px solid #d9e8de;border-radius:18px;
        padding:26px;position:relative;overflow:hidden;
        box-shadow:0 18px 40px -24px rgba(13,62,41,.2);
    }
    /* خطوط مداری */
    .brand-section::before{
        content:"";position:absolute;top:0;left:0;right:0;height:5px;
        background:
            linear-gradient(90deg,
                transparent 0%, #198754 12%, #198754 22%, transparent 28%,
                transparent 48%, #198754 58%, #198754 68%, transparent 74%,
                transparent 92%, #198754 96%, transparent 100%);
        opacity:.35;
    }

    .brand-title{
        display:flex;align-items:center;gap:10px;margin-bottom:22px;
        padding-bottom:14px;border-bottom:1px solid #e3efe7;position:relative;z-index:2;
    }
    .brand-title h3{
        font-family:'Space Grotesk','Segoe UI',sans-serif;
        font-size:21px;font-weight:700;color:#0b5134;margin:0;letter-spacing:.2px;
    }
    .brand-title .icn{
        width:30px;height:30px;border-radius:8px;
        background:linear-gradient(135deg,#27a06b,#157347);
        color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;
        box-shadow:0 4px 10px -4px rgba(21,115,71,.55);
    }

    .brand-slider-wrapper{position:relative;z-index:2}
    .brand-slider{display:flex;overflow:hidden;transition:transform .45s cubic-bezier(.22,.9,.3,1)}
    .brand-item{
        flex:0 0 calc(100%/6);
        height:62px;display:flex;align-items:center;justify-content:center;
        padding:10px;text-decoration:none;position:relative;
        border:1px solid #d9e8de;border-radius:12px;
        background:#fff;margin-right:12px;transition:.25s;
        box-shadow:0 4px 12px -10px rgba(13,62,41,.15);
    }
    .brand-item::before{
        content:"";position:absolute;top:-1px;left:-1px;right:-1px;height:3px;
        border-radius:12px 12px 0 0;
        background:linear-gradient(90deg,#27a06b,#198754);
        transform:scaleX(0);transform-origin:left;transition:transform .3s;
    }
    .brand-item:hover{transform:translateY(-3px);border-color:#9fd0b4;box-shadow:0 12px 24px -14px rgba(21,115,71,.35)}
    .brand-item:hover::before{transform:scaleX(1)}
    .brand-item img{
        max-width:82%;max-height:72%;object-fit:contain;
        filter:grayscale(1) opacity(.8);transition:.3s;
    }
    .brand-item:hover img{filter:grayscale(0) opacity(1);transform:scale(1.08)}

    .bbtn{
        position:absolute;top:50%;transform:translateY(-50%);z-index:6;
        width:36px;height:36px;border-radius:50%;
        background:#fff;border:1px solid #cfe2d6;color:#198754;
        font-size:12px;cursor:pointer;transition:.25s;
        display:flex;align-items:center;justify-content:center;
        box-shadow:0 6px 14px -8px rgba(13,62,41,.25);
    }
    .bbtn:hover{
        background:linear-gradient(135deg,#27a06b,#157347);
        color:#fff;border-color:transparent;
        box-shadow:0 8px 18px -8px rgba(21,115,71,.5);
    }
    .bbtn.left{left:-13px}
    .bbtn.right{right:-13px}
    .bbtn.disabled{opacity:.3;pointer-events:none}

    @media(max-width:768px){ .brand-item{flex-basis:33.33%} }
    @media(max-width:480px){ .brand-item{flex-basis:50%} }
</style>
</head>
<body>
<div class="wrap">
    <div class="brand-section">
        <div class="brand-title">
            <span class="icn"><i class="fa-solid fa-microchip"></i></span>
            <h3>Top Brands</h3>
        </div>
        <div class="brand-slider-wrapper">
            <button class="bbtn left" id="pv"><i class="fa-solid fa-chevron-left"></i></button>
            <div class="brand-slider" id="tr">
                <a href="#" class="brand-item"><img src="Logo_SAMSUNG.webp" alt="Samsung"></a>
                <a href="#" class="brand-item"><img src="Logo_Apple.webp" alt="Apple"></a>
                <a href="#" class="brand-item"><img src="Logo_Xiaomi.webp" alt="Xiaomi"></a>
                <a href="#" class="brand-item"><img src="Logo_NOKIA.webp" alt="Nokia"></a>
                <a href="#" class="brand-item"><img src="Logo_AUSU.webp" alt="ASUS"></a>
                <a href="#" class="brand-item"><img src="Logo_JBL.webp" alt="JBL"></a>
                <a href="#" class="brand-item"><img src="Logo_SONY.webp" alt="Sony"></a>
                <a href="#" class="brand-item"><img src="Logo_LG.webp" alt="LG"></a>
                <a href="#" class="brand-item"><img src="Logo_HUAWEl.webp" alt="Huawei"></a>
                <a href="#" class="brand-item"><img src="Logo_TP-LINK.webp" alt="TP-Link"></a>
            </div>
            <button class="bbtn right" id="nx"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
    </div>
</div>

<script>
    const tr = document.getElementById('tr'), pv = document.getElementById('pv'), nx = document.getElementById('nx');
    let idx = 0;
    const per = (tr.clientWidth > 0 && tr.children[0].getBoundingClientRect().width > 0)
        ? Math.max(1, Math.round(tr.clientWidth / tr.children[0].getBoundingClientRect().width)) : 6;
    const max = tr.children.length - per;
    function update(){
        if (idx > max) idx = max;
        tr.style.transform = 'translateX(-' + (idx * (100/per)) + '%)';
        pv.classList.toggle('disabled', idx <= 0);
        nx.classList.toggle('disabled', idx >= max);
    }
    pv.onclick = () => { if (idx > 0){ idx--; update(); } };
    nx.onclick = () => { if (idx < max){ idx++; update(); } };
    window.addEventListener('resize', update);
    update();
</script>
</body>
</html>
