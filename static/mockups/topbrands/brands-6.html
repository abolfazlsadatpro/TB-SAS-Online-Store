<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Brands 2 — Gradient Bar</title>
<link rel="stylesheet" href="boot.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f4f7f5;padding:30px}
    .wrap{max-width:1300px;margin:0 auto}

    /* نوار گرادیانی سبز */
    .brand-section{
        background:linear-gradient(135deg,#0b5134,#198754);
        border-radius:18px;padding:26px;position:relative;overflow:hidden;
        box-shadow:0 18px 40px -18px rgba(10,77,51,.5);
    }
    .brand-section::before{
        content:"";position:absolute;top:-80px;right:-50px;
        width:240px;height:240px;border-radius:50%;
        background:radial-gradient(circle,rgba(255,255,255,.08),transparent 65%);
    }
    .brand-title{
        display:flex;align-items:center;gap:12px;margin-bottom:20px;
        position:relative;z-index:2;
    }
    .brand-title h3{
        font-size:21px;font-weight:800;color:#fff;margin:0;
        text-shadow:0 2px 10px rgba(0,0,0,.25);
    }
    .brand-title i{color:#ffd166;font-size:20px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.3))}

    .brand-slider-wrapper{position:relative;z-index:2}
    .brand-slider{display:flex;overflow:hidden;transition:transform .45s cubic-bezier(.22,.9,.3,1)}
    .brand-item{
        flex:0 0 calc(100%/6);
        height:60px;display:flex;align-items:center;justify-content:center;
        background:rgba(255,255,255,.1);
        border:1px solid rgba(255,255,255,.15);
        -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
        border-radius:10px;margin-right:10px;transition:.25s;text-decoration:none;
    }
    .brand-item:hover{background:rgba(255,255,255,.22);transform:translateY(-3px)}
    .brand-item img{
        max-width:80%;max-height:45px;object-fit:contain;
        filter:brightness(0) invert(1);opacity:.9;transition:.25s;
    }
    .brand-item:hover img{opacity:1}

    .bbtn{
        position:absolute;top:42%;transform:translateY(-50%);z-index:5;
        width:36px;height:36px;border-radius:50%;
        background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);
        color:#fff;font-size:13px;cursor:pointer;transition:.25s;
        display:flex;align-items:center;justify-content:center;
        -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    }
    .bbtn:hover{background:rgba(255,255,255,.35)}
    .bbtn.left{left:6px}
    .bbtn.right{right:6px}
    .bbtn.disabled{opacity:.25;pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
    <div class="brand-section">
        <div class="brand-title">
            <i class="fa-solid fa-check-circle"></i>
            <h3>Top Brands</h3>
        </div>
        <div class="brand-slider-wrapper">
            <button class="bbtn left" id="pv"><i class="fa-solid fa-chevron-left"></i></button>
            <div class="brand-slider" id="tr">
                <a href="#" class="brand-item"><img src="Logo_SAMSUNG.webp"></a>
                <a href="#" class="brand-item"><img src="Logo_Apple.webp"></a>
                <a href="#" class="brand-item"><img src="Logo_Xiaomi.webp"></a>
                <a href="#" class="brand-item"><img src="Logo_NOKIA.webp"></a>
                <a href="#" class="brand-item"><img src="Logo_AUSU.webp"></a>
                <a href="#" class="brand-item"><img src="Logo_JBL.webp"></a>
                <a href="#" class="brand-item"><img src="Logo_SONY.webp"></a>
                <a href="#" class="brand-item"><img src="Logo_LG.webp"></a>
                <a href="#" class="brand-item"><img src="Logo_HUAWEl.webp"></a>
                <a href="#" class="brand-item"><img src="Logo_TP-LINK.webp"></a>
            </div>
            <button class="bbtn right" id="nx"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
    </div>
</div>

<script>
    const tr = document.getElementById('tr'), pv = document.getElementById('pv'), nx = document.getElementById('nx');
    const per = 6; let idx = 0; const max = tr.children.length - per;
    function update(){
        tr.style.transform = 'translateX(-' + (idx * (100/per)) + '%)';
        pv.classList.toggle('disabled', idx <= 0);
        nx.classList.toggle('disabled', idx >= max);
    }
    pv.onclick = () => { if(idx > 0){ idx--; update(); } };
    nx.onclick = () => { if(idx < max){ idx++; update(); } };
    update();
</script>
</body>
</html>
