<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Brands 2 — Circle Row</title>
<link rel="stylesheet" href="boot.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f4f7f5;padding:30px}
    .wrap{max-width:1300px;margin:0 auto}

    .brand-section{
        background:#fff;border:1px solid #e8ede9;border-radius:16px;
        padding:24px;position:relative;overflow:hidden;
    }
    .brand-title{
        display:flex;align-items:center;gap:10px;margin-bottom:20px;
    }
    .brand-title h3{font-size:19px;font-weight:800;color:#1b2b22;margin:0}
    .brand-title i{color:#198754;font-size:18px}

    .brand-slider-wrapper{position:relative;padding:6px 0 14px}
    .brand-slider{
        display:flex;gap:26px;overflow:hidden;
        transition:transform .45s cubic-bezier(.22,.9,.3,1);align-items:center;
    }
    .brand-item{
        flex:0 0 96px;display:flex;flex-direction:column;align-items:center;gap:9px;
        text-decoration:none;color:#1b2b22;
    }
    .br-ico{
        width:72px;height:72px;border-radius:50%;
        background:linear-gradient(145deg,#fff,#ecf6ef);
        border:2px solid rgba(25,135,84,.12);
        display:flex;align-items:center;justify-content:center;padding:10px;
        box-shadow:0 8px 18px -10px rgba(13,62,41,.25);
        transition:.25s;
    }
    .br-ico img{max-width:100%;max-height:100%;object-fit:contain}
    .brand-item:hover .br-ico{transform:translateY(-5px);border-color:#198754;box-shadow:0 12px 24px -10px rgba(21,115,71,.3)}
    .brand-item span{font-size:12px;font-weight:600;color:#3d4f46}
    .brand-item:hover span{color:#198754}

    .bbtn{
        position:absolute;top:40%;transform:translateY(-50%);z-index:5;
        width:34px;height:34px;border-radius:50%;
        background:#fff;border:1px solid #d8e4dc;color:#198754;
        font-size:12px;cursor:pointer;transition:.2s;
        display:flex;align-items:center;justify-content:center;
        box-shadow:0 4px 12px -6px rgba(20,40,30,.2);
    }
    .bbtn:hover{background:#198754;color:#fff;border-color:#198754}
    .bbtn.left{left:2px}
    .bbtn.right{right:2px}
    .bbtn.disabled{opacity:.3;pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
    <div class="brand-section">
        <div class="brand-title">
            <i class="fa-solid fa-check-circle text-4xl"></i>
            <h3>Top Brands</h3>
        </div>
        <div class="brand-slider-wrapper">
            <button class="bbtn left" id="pv"><i class="fa-solid fa-chevron-left"></i></button>
            <div class="brand-slider" id="tr">
                <a href="#" class="brand-item"><div class="br-ico"><img src="Logo_SAMSUNG.webp"></div><span>Samsung</span></a>
                <a href="#" class="brand-item"><div class="br-ico"><img src="Logo_Apple.webp"></div><span>Apple</span></a>
                <a href="#" class="brand-item"><div class="br-ico"><img src="Logo_Xiaomi.webp"></div><span>Xiaomi</span></a>
                <a href="#" class="brand-item"><div class="br-ico"><img src="Logo_NOKIA.webp"></div><span>Nokia</span></a>
                <a href="#" class="brand-item"><div class="br-ico"><img src="Logo_AUSU.webp"></div><span>ASUS</span></a>
                <a href="#" class="brand-item"><div class="br-ico"><img src="Logo_JBL.webp"></div><span>JBL</span></a>
                <a href="#" class="brand-item"><div class="br-ico"><img src="Logo_SONY.webp"></div><span>Sony</span></a>
                <a href="#" class="brand-item"><div class="br-ico"><img src="Logo_LG.webp"></div><span>LG</span></a>
                <a href="#" class="brand-item"><div class="br-ico"><img src="Logo_HUAWEl.webp"></div><span>Huawei</span></a>
                <a href="#" class="brand-item"><div class="br-ico"><img src="Logo_TP-LINK.webp"></div><span>TP-Link</span></a>
            </div>
            <button class="bbtn right" id="nx"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
    </div>
</div>

<script>
    const tr = document.getElementById('tr'), pv = document.getElementById('pv'), nx = document.getElementById('nx');
    const per = 8; let idx = 0; const max = tr.children.length - per;
    function update(){
        tr.style.transform = 'translateX(-' + (idx * (100/per)) + '%)';
        pv.classList.toggle('disabled', idx <= 0);
        nx.classList.toggle('disabled', idx >= max);
    }
    pv.onclick = () => { if(idx > 0){ idx--; update(); } };
    nx.onclick = () => { if(idx < max){ idx++; update(); } };
    update();
</script>
</body>
</html>
