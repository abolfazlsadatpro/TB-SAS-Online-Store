<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Brands — Soft Pastel</title>
<link rel="stylesheet" href="boot.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',Tahoma,sans-serif;background:#fdf6f0;padding:30px;min-height:100vh}
    .wrap{max-width:1300px;margin:0 auto}

    .brand-section{
        background:linear-gradient(155deg,#fff7f2,#fdf0e7 55%,#f6f2ff);
        border:1px solid #f4e4d8;border-radius:22px;
        padding:28px;position:relative;overflow:hidden;
        box-shadow:0 20px 44px -24px rgba(214,158,120,.35);
    }
    .brand-section::before{
        content:"";position:absolute;top:-50px;right:-40px;
        width:180px;height:180px;border-radius:50%;
        background:radial-gradient(circle,rgba(240,170,130,.16),transparent 62%);
    }

    .brand-title{
        display:flex;align-items:center;gap:12px;margin-bottom:22px;position:relative;z-index:2;
    }
    .brand-title h3{
        font-size:22px;font-weight:800;color:#b0613f;margin:0;letter-spacing:-.3px;
    }
    .brand-title .dot{
        width:8px;height:8px;border-radius:50%;background:#e8a276;
        box-shadow:0 0 0 4px rgba(232,162,118,.22);
    }

    .brand-slider-wrapper{position:relative;z-index:2}
    .brand-slider{display:flex;overflow:hidden;transition:transform .45s cubic-bezier(.22,.9,.3,1)}
    .brand-item{
        flex:0 0 calc(100%/6);
        height:64px;display:flex;align-items:center;justify-content:center;
        padding:10px;text-decoration:none;
        background:#fff;border-radius:14px;margin-right:12px;transition:.3s;
        box-shadow:0 6px 16px -10px rgba(176,97,63,.22);
    }
    .brand-item:hover{
        transform:translateY(-4px);
        box-shadow:0 14px 26px -12px rgba(176,97,63,.35);
    }
    .brand-item img{
        max-width:80%;max-height:72%;object-fit:contain;
        filter:grayscale(1) opacity(.85);transition:.3s;
    }
    .brand-item:hover img{
        filter:grayscale(0) opacity(1);transform:scale(1.1);
    }

    .bbtn{
        position:absolute;top:50%;transform:translateY(-50%);z-index:6;
        width:36px;height:36px;border-radius:50%;
        background:#fff;border:1px solid #f2d9c9;color:#b0613f;
        font-size:12px;cursor:pointer;transition:.25s;
        display:flex;align-items:center;justify-content:center;
        box-shadow:0 6px 14px -8px rgba(176,97,63,.28);
    }
    .bbtn:hover{
        background:linear-gradient(135deg,#f5b896,#e8a276);
        color:#fff;border-color:transparent;
    }
    .bbtn.left{left:-13px}
    .bbtn.right{right:-13px}
    .bbtn.disabled{opacity:.3;pointer-events:none}

    @media(max-width:768px){ .brand-item{flex-basis:33.33%} }
    @media(max-width:480px){ .brand-item{flex-basis:50%} }
</style>
</head>
<body>
<div class="wrap">
    <div class="brand-section">
        <div class="brand-title">
            <span class="dot"></span>
            <h3>Top Brands</h3>
        </div>
        <div class="brand-slider-wrapper">
            <button class="bbtn left" id="pv"><i class="fa-solid fa-chevron-left"></i></button>
            <div class="brand-slider" id="tr">
                <a href="#" class="brand-item"><img src="Logo_SAMSUNG.webp" alt="Samsung"></a>
                <a href="#" class="brand-item"><img src="Logo_Apple.webp" alt="Apple"></a>
                <a href="#" class="brand-item"><img src="Logo_Xiaomi.webp" alt="Xiaomi"></a>
                <a href="#" class="brand-item"><img src="Logo_NOKIA.webp" alt="Nokia"></a>
                <a href="#" class="brand-item"><img src="Logo_AUSU.webp" alt="ASUS"></a>
                <a href="#" class="brand-item"><img src="Logo_JBL.webp" alt="JBL"></a>
                <a href="#" class="brand-item"><img src="Logo_SONY.webp" alt="Sony"></a>
                <a href="#" class="brand-item"><img src="Logo_LG.webp" alt="LG"></a>
                <a href="#" class="brand-item"><img src="Logo_HUAWEl.webp" alt="Huawei"></a>
                <a href="#" class="brand-item"><img src="Logo_TP-LINK.webp" alt="TP-Link"></a>
            </div>
            <button class="bbtn right" id="nx"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
    </div>
</div>

<script>
    const tr = document.getElementById('tr'), pv = document.getElementById('pv'), nx = document.getElementById('nx');
    let idx = 0;
    const per = (tr.clientWidth > 0 && tr.children[0].getBoundingClientRect().width > 0)
        ? Math.max(1, Math.round(tr.clientWidth / tr.children[0].getBoundingClientRect().width)) : 6;
    const max = tr.children.length - per;
    function update(){
        if (idx > max) idx = max;
        tr.style.transform = 'translateX(-' + (idx * (100/per)) + '%)';
        pv.classList.toggle('disabled', idx <= 0);
        nx.classList.toggle('disabled', idx >= max);
    }
    pv.onclick = () => { if (idx > 0){ idx--; update(); } };
    nx.onclick = () => { if (idx < max){ idx++; update(); } };
    window.addEventListener('resize', update);
    update();
</script>
</body>
</html>
