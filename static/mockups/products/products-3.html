<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products 3 — Glass Minimal</title>
<link rel="stylesheet" href="boot.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f4f7f5;padding:30px}
    .wrap{max-width:1300px;margin:0 auto}

    .sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    .sec-head h2{font-size:21px;font-weight:800;color:#1b2b22}
    .sec-head .all{color:#198754;font-size:13px;font-weight:600;text-decoration:none}
    .sec-sub{color:#8aa496;font-size:12.5px;margin-bottom:24px}

    .slider{display:flex;gap:16px;overflow-x:auto;padding:8px 4px 20px;scrollbar-width:none}
    .slider::-webkit-scrollbar{display:none}

    .card{
        flex:0 0 195px;background:rgba(255,255,255,.7);border-radius:16px;
        border:1px solid rgba(255,255,255,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
        padding:14px;text-decoration:none;color:#1b2b22;transition:.3s;
        box-shadow:0 12px 28px -14px rgba(20,40,30,.18);
    }
    .card:hover{transform:translateY(-5px);box-shadow:0 20px 38px -16px rgba(20,40,30,.25);background:rgba(255,255,255,.9)}
    .card-img{
        position:relative;height:130px;background:rgba(255,255,255,.6);border-radius:12px;
        display:flex;align-items:center;justify-content:center;padding:10px;margin-bottom:11px;
    }
    .card-img img{max-width:85%;max-height:100%;object-fit:contain;transition:.3s}
    .card:hover .card-img img{transform:scale(1.05)}
    .card-tag{position:absolute;top:8px;left:8px;background:#e6484d;color:#fff;font-size:10px;font-weight:800;padding:3px 7px;border-radius:4px}
    .card h5{font-size:12.5px;font-weight:600;color:#3d4f46;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .card-price{display:flex;align-items:baseline;gap:6px;margin-bottom:9px}
    .card-price .new{font-size:15px;font-weight:800;color:#1b2b22}
    .card-price .old{font-size:11.5px;color:#a9b5ae;text-decoration:line-through}
    .stars{font-size:11px;color:#f5a623;margin-bottom:9px}
    .stars span{color:#a9b5ae;font-size:10.5px;margin-left:4px}
    .card-btn{
        width:100%;padding:8px;border:none;border-radius:9px;cursor:pointer;
        background:linear-gradient(135deg,#198754,#16a34a);color:#fff;
        font-weight:700;font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.2s;
    }
    .card-btn:hover{filter:brightness(1.1)}
</style>
</head>
<body>

<div class="wrap">
    <div class="sec-head">
        <h2>Latest Products</h2>
        <a href="#" class="all">View All →</a>
    </div>
    <p class="sec-sub">Stay up to date with our newest arrivals</p>

    <div class="slider">
        <a href="#" class="card">
            <div class="card-img"><span class="card-tag">-12%</span><img src="samsung-galaxy-s25-ultra.webp" alt=""></div>
            <h5>Galaxy S25 Ultra</h5>
            <div class="card-price"><span class="new">$1,149</span><span class="old">$1,299</span></div>
            <div class="stars"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-regular fa-star"></i><span>(24)</span></div>
            <button class="card-btn"><i class="fa-solid fa-cart-plus"></i> Add to Cart</button>
        </a>
        <a href="#" class="card">
            <div class="card-img"><span class="card-tag">-7%</span><img src="apple-iphone-16-pro-max.webp" alt=""></div>
            <h5>iPhone 16 Pro Max</h5>
            <div class="card-price"><span class="new">$1,199</span><span class="old">$1,299</span></div>
            <div class="stars"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><span>(58)</span></div>
            <button class="card-btn"><i class="fa-solid fa-cart-plus"></i> Add to Cart</button>
        </a>
        <a href="#" class="card">
            <div class="card-img"><span class="card-tag">-12%</span><img src="xiaomi-15-pro.webp" alt=""></div>
            <h5>Xiaomi 15 Pro</h5>
            <div class="card-price"><span class="new">$699</span><span class="old">$799</span></div>
            <div class="stars"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-regular fa-star"></i><span>(17)</span></div>
            <button class="card-btn"><i class="fa-solid fa-cart-plus"></i> Add to Cart</button>
        </a>
        <a href="#" class="card">
            <div class="card-img"><span class="card-tag">-14%</span><img src="poco-f7-pro.webp" alt=""></div>
            <h5>Poco F7 Pro</h5>
            <div class="card-price"><span class="new">$429</span><span class="old">$499</span></div>
            <div class="stars"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-regular fa-star"></i><i class="fa-regular fa-star"></i><span>(9)</span></div>
            <button class="card-btn"><i class="fa-solid fa-cart-plus"></i> Add to Cart</button>
        </a>
        <a href="#" class="card">
            <div class="card-img"><img src="msi-katana-15.webp" alt=""></div>
            <h5>MSI Katana 15</h5>
            <div class="card-price"><span class="new">$1,349</span></div>
            <div class="stars"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><span>(31)</span></div>
            <button class="card-btn"><i class="fa-solid fa-cart-plus"></i> Add to Cart</button>
        </a>
    </div>
</div>

</body>
</html>
