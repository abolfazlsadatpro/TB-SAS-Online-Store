<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latest Products — Emerald Lux</title>
<link rel="stylesheet" href="../topbrands/boot.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',Tahoma,sans-serif;background:#e8f3ec;padding:30px;min-height:100vh}
    .wrap{max-width:1300px;margin:0 auto}

    .product-section{
        background:
            radial-gradient(900px 320px at 85% -20%, rgba(39,160,107,.16), transparent 60%),
            radial-gradient(700px 280px at 8% 115%, rgba(21,115,71,.09), transparent 55%),
            #f4faf6;
        border:1px solid rgba(39,160,107,.3);
        border-radius:20px;padding:28px;position:relative;overflow:hidden;
        box-shadow:0 26px 60px -26px rgba(13,62,41,.35);
    }
    .product-section::after{
        content:"";position:absolute;inset:0;pointer-events:none;
        background:linear-gradient(180deg,transparent,rgba(39,160,107,.04) 55%,transparent);
    }

    .product-title{
        display:flex;align-items:center;gap:14px;margin-bottom:24px;position:relative;z-index:2;
    }
    .product-title h3{
        font-family:'Playfair Display','Georgia',serif;
        font-size:27px;font-weight:700;letter-spacing:.5px;margin:0;
        background:linear-gradient(95deg,#1b7a4e 5%,#198754 48%,#0f5c3a 95%);
        -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
        filter:drop-shadow(0 2px 10px rgba(21,115,71,.18));
    }
    .product-title .bar{
        flex:0 0 46px;height:2px;
        background:linear-gradient(90deg,#27a06b,rgba(39,160,107,0));
    }
    .product-title .count{
        margin-left:auto;font-size:11px;letter-spacing:3px;color:rgba(11,81,52,.55);
        text-transform:uppercase;
    }

    .product-slider-wrapper{position:relative;z-index:2;padding:0 8px}
    .product-slider{display:flex;overflow:hidden;transition:transform .45s cubic-bezier(.22,.9,.3,1)}
    .product-item{
        flex:0 0 calc(100%/5);
        height:auto;display:flex;flex-direction:column;align-items:center;
        padding:14px;position:relative;text-decoration:none;
        border:1px solid rgba(39,160,107,.2);border-radius:14px;
        background:#fff;margin-right:14px;transition:.25s;
        box-shadow:0 6px 16px -12px rgba(13,62,41,.22);
    }
    .product-item::after{
        content:"";position:absolute;left:0;right:0;bottom:0;height:2px;
        background:linear-gradient(90deg,transparent,#27a06b,transparent);
        transform:scaleX(0);transform-origin:center;transition:transform .3s;
    }
    .product-item:hover{
        background:#f6fbf8;border-color:rgba(39,160,107,.55);
        box-shadow:0 12px 24px -12px rgba(21,115,71,.3);
    }
    .product-item:hover::after{transform:scaleX(1)}

    .product-item .p-img{
        width:100%;height:130px;display:flex;align-items:center;justify-content:center;
        margin-bottom:10px;position:relative;
    }
    .product-item .p-img img{
        max-width:90%;max-height:120px;object-fit:contain;transition:.3s;
    }
    .product-item:hover .p-img img{transform:scale(1.06)}
    .product-item .disc-tag{
        position:absolute;top:0;left:0;
        background:linear-gradient(135deg,#27a06b,#157347);
        color:#fff;font-size:11px;font-weight:700;padding:4px 9px;
        border-radius:0 0 10px 0;z-index:2;
        box-shadow:0 4px 10px -4px rgba(21,115,71,.55);
    }
    .product-item .wish{
        position:absolute;top:8px;right:8px;
        width:30px;height:30px;border-radius:50%;
        background:#fff;border:1px solid rgba(39,160,107,.25);
        color:#198754;font-size:12px;cursor:pointer;
        display:flex;align-items:center;justify-content:center;transition:.2s;
        box-shadow:0 4px 10px -6px rgba(13,62,41,.3);
    }
    .product-item .wish:hover{background:#198754;color:#fff;border-color:#198754}

    .product-item .p-name{
        font-size:13px;font-weight:600;color:#3d4f46;text-align:center;
        margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
        width:100%;
    }
    .product-item .p-price{
        display:flex;align-items:baseline;gap:6px;
    }
    .product-item .p-price .new{
        font-size:15px;font-weight:800;color:#1b2b22;
    }
    .product-item .p-price .old{
        font-size:11.5px;color:#a9b5ae;text-decoration:line-through;
    }

    .bbtn{
        position:absolute;top:50%;transform:translateY(-50%);z-index:6;
        width:38px;height:38px;border-radius:50%;
        background:#fff;border:1px solid rgba(39,160,107,.4);
        color:#198754;font-size:13px;cursor:pointer;transition:.25s;
        display:flex;align-items:center;justify-content:center;
        box-shadow:0 6px 16px -10px rgba(13,62,41,.3);
    }
    .bbtn:hover{
        background:linear-gradient(135deg,#27a06b,#198754);
        color:#fff;border-color:transparent;
        box-shadow:0 8px 20px -8px rgba(21,115,71,.55);
    }
    .bbtn.left{left:-14px}
    .bbtn.right{right:-14px}
    .bbtn.disabled{opacity:.25;pointer-events:none}

    @media(max-width:992px){ .product-item{flex-basis:33.33%} }
    @media(max-width:768px){ .product-item{flex-basis:50%} }
    @media(max-width:480px){ .product-item{flex-basis:100%} }
</style>
</head>
<body>
<div class="wrap">
    <div class="product-section">
        <div class="product-title">
            <h3>Latest Products</h3>
            <span class="bar"></span>
            <span class="count">10 Items</span>
        </div>
        <div class="product-slider-wrapper">
            <button class="bbtn left" id="pv"><i class="fa-solid fa-chevron-left"></i></button>
            <div class="product-slider" id="tr">
                <a href="#" class="product-item">
                    <div class="p-img">
                        <span class="disc-tag">-12%</span>
                        <span class="wish"><i class="fa-regular fa-heart"></i></span>
                        <img src="samsung-galaxy-s25-ultra.webp" alt="Samsung Galaxy S25 Ultra">
                    </div>
                    <div class="p-name">Samsung Galaxy S25 Ultra</div>
                    <div class="p-price"><span class="new">$1,299</span></div>
                </a>
                <a href="#" class="product-item">
                    <div class="p-img">
                        <span class="disc-tag">-8%</span>
                        <span class="wish"><i class="fa-regular fa-heart"></i></span>
                        <img src="apple-iphone-16-pro-max.webp" alt="Apple iPhone 16 Pro Max">
                    </div>
                    <div class="p-name">Apple iPhone 16 Pro Max</div>
                    <div class="p-price"><span class="old">$1,199</span><span class="new">$1,099</span></div>
                </a>
                <a href="#" class="product-item">
                    <div class="p-img">
                        <span class="wish"><i class="fa-regular fa-heart"></i></span>
                        <img src="xiaomi-15-pro.webp" alt="Xiaomi 15 Pro">
                    </div>
                    <div class="p-name">Xiaomi 15 Pro</div>
                    <div class="p-price"><span class="new">$899</span></div>
                </a>
                <a href="#" class="product-item">
                    <div class="p-img">
                        <span class="wish"><i class="fa-regular fa-heart"></i></span>
                        <img src="poco-f7-pro.webp" alt="Poco F7 Pro">
                    </div>
                    <div class="p-name">Poco F7 Pro</div>
                    <div class="p-price"><span class="new">$549</span></div>
                </a>
                <a href="#" class="product-item">
                    <div class="p-img">
                        <span class="wish"><i class="fa-regular fa-heart"></i></span>
                        <img src="honor-magic-7.webp" alt="Honor Magic 7">
                    </div>
                    <div class="p-name">Honor Magic 7</div>
                    <div class="p-price"><span class="new">$649</span></div>
                </a>
                <a href="#" class="product-item">
                    <div class="p-img">
                        <span class="disc-tag">-15%</span>
                        <span class="wish"><i class="fa-regular fa-heart"></i></span>
                        <img src="msi-katana-15.webp" alt="MSI Katana 15">
                    </div>
                    <div class="p-name">MSI Katana 15</div>
                    <div class="p-price"><span class="old">$1,499</span><span class="new">$1,274</span></div>
                </a>
                <a href="#" class="product-item">
                    <div class="p-img">
                        <span class="wish"><i class="fa-regular fa-heart"></i></span>
                        <img src="acer-nitro-16.webp" alt="Acer Nitro 16">
                    </div>
                    <div class="p-name">Acer Nitro 16</div>
                    <div class="p-price"><span class="new">$1,199</span></div>
                </a>
                <a href="#" class="product-item">
                    <div class="p-img">
                        <span class="wish"><i class="fa-regular fa-heart"></i></span>
                        <img src="lenovo-legion-5.webp" alt="Lenovo Legion 5">
                    </div>
                    <div class="p-name">Lenovo Legion 5</div>
                    <div class="p-price"><span class="new">$1,349</span></div>
                </a>
                <a href="#" class="product-item">
                    <div class="p-img">
                        <span class="wish"><i class="fa-regular fa-heart"></i></span>
                        <img src="asus-rog-zephyrus.webp" alt="ASUS ROG Zephyrus">
                    </div>
                    <div class="p-name">ASUS ROG Zephyrus</div>
                    <div class="p-price"><span class="new">$1,699</span></div>
                </a>
                <a href="#" class="product-item">
                    <div class="p-img">
                        <span class="wish"><i class="fa-regular fa-heart"></i></span>
                        <img src="hp-pavilion-15.webp" alt="HP Pavilion 15">
                    </div>
                    <div class="p-name">HP Pavilion 15</div>
                    <div class="p-price"><span class="new">$749</span></div>
                </a>
            </div>
            <button class="bbtn right" id="nx"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
    </div>
</div>

<script>
    const tr = document.getElementById('tr'), pv = document.getElementById('pv'), nx = document.getElementById('nx');
    let idx = 0;
    const per = (tr.clientWidth > 0 && tr.children[0].getBoundingClientRect().width > 0)
        ? Math.max(1, Math.round(tr.clientWidth / tr.children[0].getBoundingClientRect().width)) : 5;
    const max = tr.children.length - per;
    function update(){
        if (idx > max) idx = max;
        tr.style.transform = 'translateX(-' + (idx * (100/per)) + '%)';
        pv.classList.toggle('disabled', idx <= 0);
        nx.classList.toggle('disabled', idx >= max);
    }
    pv.onclick = () => { if (idx > 0){ idx--; update(); } };
    nx.onclick = () => { if (idx < max){ idx++; update(); } };
    window.addEventListener('resize', update);
    update();
</script>
</body>
</html>
