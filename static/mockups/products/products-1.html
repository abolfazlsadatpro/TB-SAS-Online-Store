<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products 1 — Modern Cards</title>
<link rel="stylesheet" href="boot.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f4f7f5;padding:30px}
    .wrap{max-width:1300px;margin:0 auto}

    .sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    .sec-head h2{font-size:21px;font-weight:800;color:#1b2b22}
    .sec-head .all{color:#198754;font-size:13px;font-weight:600;text-decoration:none}
    .sec-sub{color:#8aa496;font-size:12.5px;margin-bottom:24px}

    /* ===== اسلایدر ===== */
    .slider{display:flex;gap:16px;overflow-x:auto;padding:8px 4px 20px;scrollbar-width:none;scroll-behavior:smooth}
    .slider::-webkit-scrollbar{display:none}

    /* ===== کارت ===== */
    .card{
        flex:0 0 205px;background:#fff;border-radius:14px;overflow:hidden;
        border:1px solid #eef1ef;transition:.3s;text-decoration:none;color:#1b2b22;
    }
    .card:hover{transform:translateY(-6px);box-shadow:0 18px 36px -18px rgba(20,40,30,.3);border-color:#d8e4dc}
    .card-img{
        position:relative;height:150px;background:linear-gradient(145deg,#f4faf6,#e8f2ec);
        display:flex;align-items:center;justify-content:center;padding:14px;
    }
    .card-img img{max-width:85%;max-height:100%;object-fit:contain;transition:.3s}
    .card:hover .card-img img{transform:scale(1.06)}
    .card-tag{
        position:absolute;top:10px;left:10px;background:linear-gradient(135deg,#e6484d,#c92a2f);
        color:#fff;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:5px;
    }
    .card-wish{
        position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;
        background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;
        color:#8aa496;font-size:13px;transition:.25s;opacity:0;
    }
    .card:hover .card-wish{opacity:1}
    .card-wish:hover{color:#e6484d}
    .card-body{padding:13px 14px}
    .card-body h5{font-size:13px;font-weight:600;color:#3d4f46;margin-bottom:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .card-price{display:flex;align-items:baseline;gap:7px;margin-bottom:11px}
    .card-price .new{font-size:16px;font-weight:800;color:#1b2b22}
    .card-price .old{font-size:12px;color:#a9b5ae;text-decoration:line-through}
    .card-btn{
        width:100%;padding:9px;border:1px solid #198754;background:#fff;color:#198754;
        border-radius:9px;font-weight:700;font-size:12.5px;cursor:pointer;transition:.22s;
        display:inline-flex;align-items:center;justify-content:center;gap:7px;
    }
    .card-btn:hover{background:#198754;color:#fff}

    .foot-note{text-align:center;padding:20px 0;color:#a9b5ae;font-size:12px}
</style>
</head>
<body>

<div class="wrap">
    <div class="sec-head">
        <h2>Latest Products</h2>
        <a href="#" class="all">View All →</a>
    </div>
    <p class="sec-sub">Stay up to date with our newest arrivals</p>

    <div class="slider">
        <a href="#" class="card">
            <div class="card-img">
                <span class="card-tag">-12%</span>
                <span class="card-wish"><i class="fa-regular fa-heart"></i></span>
                <img src="samsung-galaxy-s25-ultra.webp" alt="">
            </div>
            <div class="card-body">
                <h5>Galaxy S25 Ultra</h5>
                <div class="card-price"><span class="new">$1,149</span><span class="old">$1,299</span></div>
                <button class="card-btn"><i class="fa-solid fa-cart-plus"></i> Add to Cart</button>
            </div>
        </a>
        <a href="#" class="card">
            <div class="card-img">
                <span class="card-tag">-7%</span>
                <span class="card-wish"><i class="fa-regular fa-heart"></i></span>
                <img src="apple-iphone-16-pro-max.webp" alt="">
            </div>
            <div class="card-body">
                <h5>iPhone 16 Pro Max</h5>
                <div class="card-price"><span class="new">$1,199</span><span class="old">$1,299</span></div>
                <button class="card-btn"><i class="fa-solid fa-cart-plus"></i> Add to Cart</button>
            </div>
        </a>
        <a href="#" class="card">
            <div class="card-img">
                <span class="card-tag">-12%</span>
                <span class="card-wish"><i class="fa-regular fa-heart"></i></span>
                <img src="xiaomi-15-pro.webp" alt="">
            </div>
            <div class="card-body">
                <h5>Xiaomi 15 Pro</h5>
                <div class="card-price"><span class="new">$699</span><span class="old">$799</span></div>
                <button class="card-btn"><i class="fa-solid fa-cart-plus"></i> Add to Cart</button>
            </div>
        </a>
        <a href="#" class="card">
            <div class="card-img">
                <span class="card-tag">-14%</span>
                <span class="card-wish"><i class="fa-regular fa-heart"></i></span>
                <img src="poco-f7-pro.webp" alt="">
            </div>
            <div class="card-body">
                <h5>Poco F7 Pro</h5>
                <div class="card-price"><span class="new">$429</span><span class="old">$499</span></div>
                <button class="card-btn"><i class="fa-solid fa-cart-plus"></i> Add to Cart</button>
            </div>
        </a>
        <a href="#" class="card">
            <div class="card-img">
                <span class="card-wish"><i class="fa-regular fa-heart"></i></span>
                <img src="msi-katana-15.webp" alt="">
            </div>
            <div class="card-body">
                <h5>MSI Katana 15</h5>
                <div class="card-price"><span class="new">$1,349</span></div>
                <button class="card-btn"><i class="fa-solid fa-cart-plus"></i> Add to Cart</button>
            </div>
        </a>
    </div>

    <div class="foot-note">© 2026 TBSAS</div>
</div>

</body>
</html>
