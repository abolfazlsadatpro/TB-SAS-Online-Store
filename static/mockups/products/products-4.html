<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products 4 — Dark Luxury</title>
<link rel="stylesheet" href="boot.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f4f7f5;padding:30px}
    .wrap{max-width:1300px;margin:0 auto}

    .sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    .sec-head h2{font-size:21px;font-weight:800;color:#1b2b22}
    .sec-head .all{color:#198754;font-size:13px;font-weight:600;text-decoration:none}
    .sec-sub{color:#8aa496;font-size:12.5px;margin-bottom:24px}

    .slider{display:flex;gap:16px;overflow-x:auto;padding:8px 4px 20px;scrollbar-width:none}
    .slider::-webkit-scrollbar{display:none}

    .card{
        flex:0 0 200px;background:linear-gradient(160deg,#1d3628,#162b1f);border-radius:14px;
        border:1px solid rgba(46,204,143,.15);overflow:hidden;text-decoration:none;color:#fff;transition:.3s;
    }
    .card:hover{transform:translateY(-6px);border-color:rgba(46,204,143,.4);box-shadow:0 20px 40px -18px rgba(0,0,0,.6)}
    .card-img{
        position:relative;height:140px;background:rgba(255,255,255,.04);
        display:flex;align-items:center;justify-content:center;padding:12px;
    }
    .card-img img{max-width:85%;max-height:100%;object-fit:contain;filter:drop-shadow(0 10px 20px rgba(0,0,0,.4));transition:.3s}
    .card:hover .card-img img{transform:scale(1.06)}
    .card-tag{position:absolute;top:10px;left:10px;background:linear-gradient(135deg,#e6484d,#c92a2f);color:#fff;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:5px}
    .card-body{padding:12px 14px 14px}
    .card-body h5{font-size:13px;font-weight:600;color:#c8d9cf;margin-bottom:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .card-price{display:flex;align-items:baseline;gap:7px;margin-bottom:11px}
    .card-price .new{font-size:16px;font-weight:800;color:#3ee6a0}
    .card-price .old{font-size:12px;color:#718a7b;text-decoration:line-through}
    .card-btn{
        width:100%;padding:9px;border:1px solid rgba(46,204,143,.4);background:rgba(46,204,143,.1);
        color:#3ee6a0;border-radius:9px;font-weight:700;font-size:12.5px;cursor:pointer;transition:.22s;
        display:inline-flex;align-items:center;justify-content:center;gap:7px;
    }
    .card-btn:hover{background:#3ee6a0;color:#162b1f;border-color:#3ee6a0}
</style>
</head>
<body>

<div class="wrap">
    <div class="sec-head">
        <h2>Latest Products</h2>
        <a href="#" class="all">View All →</a>
    </div>
    <p class="sec-sub">Stay up to date with our newest arrivals</p>

    <div class="slider">
        <a href="#" class="card">
            <div class="card-img"><span class="card-tag">-12%</span><img src="samsung-galaxy-s25-ultra.webp" alt=""></div>
            <div class="card-body"><h5>Galaxy S25 Ultra</h5><div class="card-price"><span class="new">$1,149</span><span class="old">$1,299</span></div><button class="card-btn"><i class="fa-solid fa-cart-plus"></i> Add to Cart</button></div>
        </a>
        <a href="#" class="card">
            <div class="card-img"><span class="card-tag">-7%</span><img src="apple-iphone-16-pro-max.webp" alt=""></div>
            <div class="card-body"><h5>iPhone 16 Pro Max</h5><div class="card-price"><span class="new">$1,199</span><span class="old">$1,299</span></div><button class="card-btn"><i class="fa-solid fa-cart-plus"></i> Add to Cart</button></div>
        </a>
        <a href="#" class="card">
            <div class="card-img"><span class="card-tag">-12%</span><img src="xiaomi-15-pro.webp" alt=""></div>
            <div class="card-body"><h5>Xiaomi 15 Pro</h5><div class="card-price"><span class="new">$699</span><span class="old">$799</span></div><button class="card-btn"><i class="fa-solid fa-cart-plus"></i> Add to Cart</button></div>
        </a>
        <a href="#" class="card">
            <div class="card-img"><img src="msi-katana-15.webp" alt=""></div>
            <div class="card-body"><h5>MSI Katana 15</h5><div class="card-price"><span class="new">$1,349</span></div><button class="card-btn"><i class="fa-solid fa-cart-plus"></i> Add to Cart</button></div>
        </a>
        <a href="#" class="card">
            <div class="card-img"><span class="card-tag">-10%</span><img src="lenovo-legion-5.webp" alt=""></div>
            <div class="card-body"><h5>Lenovo Legion 5</h5><div class="card-price"><span class="new">$1,249</span><span class="old">$1,399</span></div><button class="card-btn"><i class="fa-solid fa-cart-plus"></i> Add to Cart</button></div>
        </a>
    </div>
</div>

</body>
</html>
