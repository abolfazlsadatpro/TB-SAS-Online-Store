<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Promo 3 — White Minimal</title>
<link rel="stylesheet" href="boot.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f4f7f5;padding:30px}
    .wrap{max-width:1300px;margin:0 auto}

    /* ===== پیشنهاد ۳ — White Minimal ===== */
    .promo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .promo-card{
        position:relative;border-radius:14px;overflow:hidden;height:170px;
        background:#fff;border:1px solid #e8ede9;cursor:pointer;
        display:flex;align-items:center;justify-content:center;
        transition:.3s;
    }
    .promo-card:hover{
        border-color:#198754;
        box-shadow:0 16px 34px -16px rgba(21,115,71,.3);
        transform:translateY(-3px);
    }
    .promo-card img{max-width:75%;max-height:80%;object-fit:contain;transition:.4s}
    .promo-card:hover img{transform:scale(1.06)}
    .promo-btn{
        position:absolute;bottom:12px;left:50%;transform:translateX(-50%) translateY(8px);
        background:#198754;color:#fff;font-size:11px;font-weight:700;
        padding:7px 18px;border-radius:20px;opacity:0;transition:.3s;
        display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
    }
    .promo-card:hover .promo-btn{opacity:1;transform:translateX(-50%) translateY(0)}
    .promo-btn i{font-size:10px}
</style>
</head>
<body>

<div class="wrap">
    <div class="promo-grid">
        <div class="promo-card">
            <img src="Advertisemenet%201.png" alt="">
            <span class="promo-btn">Shop Now <i class="fa-solid fa-arrow-right"></i></span>
        </div>
        <div class="promo-card">
            <img src="Advertisemenet%202.png" alt="">
            <span class="promo-btn">Shop Now <i class="fa-solid fa-arrow-right"></i></span>
        </div>
        <div class="promo-card">
            <img src="Advertisemenet%203.png" alt="">
            <span class="promo-btn">Shop Now <i class="fa-solid fa-arrow-right"></i></span>
        </div>
    </div>
</div>

</body>
</html>
