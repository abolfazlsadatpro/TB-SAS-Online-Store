<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Promo 1 — Glass Cards</title>
<link rel="stylesheet" href="boot.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f4f7f5;padding:30px}
    .wrap{max-width:1300px;margin:0 auto}

    /* ===== پیشنهاد ۱ — Glass Cards (بدون گرادیان سبز و زوم) ===== */
    .promo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .promo-card{
        position:relative;border-radius:16px;overflow:hidden;height:170px;
        background:#fff;
        border:1px solid #e8ede9;
        box-shadow:
            0 14px 30px -14px rgba(20,40,30,.15);
        transition:.3s;cursor:pointer;
    }
    .promo-card:hover{transform:translateY(-5px);box-shadow:
        0 22px 44px -18px rgba(20,40,30,.25)}
    .promo-card img{
        position:absolute;inset:0;width:100%;height:100%;
        object-fit:cover;
    }
    .promo-overlay{
        position:absolute;inset:0;
        background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.55));
        display:flex;align-items:flex-end;padding:16px;
    }
    .promo-overlay h4{color:#fff;font-size:15px;font-weight:800;margin:0}
    .promo-overlay small{color:rgba(255,255,255,.8);font-size:11px}
    .promo-cta{
        margin-left:auto;background:#fff;color:#0b5134;
        width:34px;height:34px;border-radius:50%;
        display:flex;align-items:center;justify-content:center;
        font-size:13px;opacity:0;transform:translateX(10px);transition:.3s;
    }
    .promo-card:hover .promo-cta{opacity:1;transform:translateX(0)}
</style>
</head>
<body>

<div class="wrap">
    <div class="promo-grid">
        <div class="promo-card">
            <img src="Advertisemenet%201.png" alt="">
            <div class="promo-overlay">
                <div><h4>New Season</h4><small>Shop now</small></div>
                <div class="promo-cta"><i class="fa-solid fa-arrow-right"></i></div>
            </div>
        </div>
        <div class="promo-card">
            <img src="Advertisemenet%202.png" alt="">
            <div class="promo-overlay">
                <div><h4>Hot Deals</h4><small>Limited time</small></div>
                <div class="promo-cta"><i class="fa-solid fa-arrow-right"></i></div>
            </div>
        </div>
        <div class="promo-card">
            <img src="Advertisemenet%203.png" alt="">
            <div class="promo-overlay">
                <div><h4>Big Sale</h4><small>Up to 40% off</small></div>
                <div class="promo-cta"><i class="fa-solid fa-arrow-right"></i></div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
