<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brands 5 — Hover Lift</title>
<link rel="stylesheet" href="boot.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f4f7f5;padding:30px}
    .wrap{max-width:1300px;margin:0 auto}

    .sec-title{text-align:center;font-size:24px;font-weight:800;margin-bottom:8px;color:#1b2b22}
    .sec-sub{text-align:center;color:#8aa496;font-size:13px;margin-bottom:30px}

    /* ===== پیشنهاد ۵ — Hover Lift (عکس شناور) ===== */
    .brands-lift{
        display:flex;justify-content:center;align-items:center;gap:38px;
        padding:20px 0;
    }
    .brand-lift{
        display:flex;flex-direction:column;align-items:center;gap:14px;
        text-decoration:none;color:#1b2b22;
    }
    .lift-wrap{
        position:relative;
    }
    .lift-wrap::before{
        content:"";position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);
        width:70%;height:18px;border-radius:50%;
        background:rgba(13,62,41,.12);
        filter:blur(6px);
        transition:.35s;
    }
    .lift-img{
        position:relative;width:118px;height:118px;
        display:flex;align-items:center;justify-content:center;
        transition:.35s cubic-bezier(.22,.9,.3,1);
        z-index:2;
    }
    .lift-img img{
        width:100%;height:100%;object-fit:contain;
        filter:drop-shadow(0 14px 24px rgba(13,62,41,.22));
        transition:.35s;
    }
    .brand-lift:hover .lift-img{
        transform:translateY(-16px) scale(1.06);
    }
    .brand-lift:hover .lift-wrap::before{
        width:52%;bottom:-20px;
        background:rgba(13,62,41,.18);
    }
    .brand-lift span{
        font-size:14px;font-weight:700;color:#3d4f46;transition:.25s;
        letter-spacing:.3px;
    }
    .brand-lift:hover span{color:#198754;transform:translateY(-4px)}
    .brand-lift small{
        font-size:10.5px;color:#a9b5ae;font-weight:600;
        margin-top:-10px;transition:.25s;
    }
    .brand-lift:hover small{color:#8aa496}
</style>
</head>
<body>

<div class="wrap">
    <h2 class="sec-title">Mobile Bests</h2>
    <p class="sec-sub">Top mobile brands loved by our customers</p>

    <div class="brands-lift">
        <a href="#" class="brand-lift">
            <div class="lift-wrap"><div class="lift-img"><img src="samsung.webp" alt=""></div></div>
            <span>Samsung</span>
            <small>Galaxy S25 Ultra</small>
        </a>
        <a href="#" class="brand-lift">
            <div class="lift-wrap"><div class="lift-img"><img src="apple.webp" alt=""></div></div>
            <span>Apple</span>
            <small>iPhone 16 Pro Max</small>
        </a>
        <a href="#" class="brand-lift">
            <div class="lift-wrap"><div class="lift-img"><img src="xiaomi.webp" alt=""></div></div>
            <span>Xiaomi</span>
            <small>Mi 15 Pro</small>
        </a>
        <a href="#" class="brand-lift">
            <div class="lift-wrap"><div class="lift-img"><img src="honor.webp" alt=""></div></div>
            <span>Honor</span>
            <small>Magic 7</small>
        </a>
        <a href="#" class="brand-lift">
            <div class="lift-wrap"><div class="lift-img"><img src="nokia.webp" alt=""></div></div>
            <span>Nokia</span>
            <small>Classic</small>
        </a>
    </div>
</div>

</body>
</html>
