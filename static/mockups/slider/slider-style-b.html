<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slider B — Modern Rounded</title>
<link rel="stylesheet" href="boot.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f4f7f5;padding:20px}
    .carousel-wrap{max-width:1300px;margin:0 auto;position:relative}

    .carousel-item img{height:600px;object-fit:cover;width:100%}

    /* ===== دکمه‌ها — Modern Rounded ===== */
    .carousel-control-prev,.carousel-control-next{
        width:58px;height:58px;top:50%;transform:translateY(-50%);bottom:auto;
        background:#fff;border:none;border-radius:16px;opacity:1;margin:0 24px;
        box-shadow:0 10px 26px -8px rgba(0,0,0,.35);transition:.25s;
    }
    .carousel-control-prev:hover,.carousel-control-next:hover{
        background:#198754;transform:translateY(-50%) scale(1.06);
    }
    .carousel-control-prev-icon,.carousel-control-next-icon{
        width:24px;height:24px;filter:invert(60%) sepia(60%) saturate(500%) hue-rotate(100deg);
    }
    .carousel-control-prev:hover .carousel-control-prev-icon,
    .carousel-control-next:hover .carousel-control-next-icon{
        filter:invert(100%) sepia(0%) saturate(0%);
    }

    /* ===== متن — باکس شیشه‌ای ===== */
    .carousel-caption{
        left:50%;transform:translateX(-50%);bottom:0;right:0;
        text-align:center;background:none;padding:0;
    }
    .carousel-caption .caption-inner{
        display:inline-block;
        background:rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.25);
        -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
        padding:28px 42px;border-radius:20px;margin-bottom:60px;
    }
    .carousel-caption h1{
        font-size:40px;font-weight:800;letter-spacing:-.5px;margin-bottom:10px;
    }
    .carousel-caption p{
        font-size:16px;color:rgba(255,255,255,.9);line-height:1.7;margin-bottom:20px;
    }
    .carousel-caption .btn{
        display:inline-flex;align-items:center;gap:9px;
        background:linear-gradient(135deg,#16a34a,#0e6b45);color:#fff;font-weight:800;
        padding:13px 28px;border-radius:30px;border:none;
        box-shadow:0 8px 20px -6px rgba(0,0,0,.4);transition:.2s;font-size:14px;
    }
    .carousel-caption .btn:hover{transform:translateY(-2px);background:linear-gradient(135deg,#1da165,#0b5134)}

    .carousel-indicators{bottom:22px}
    .carousel-indicators [data-bs-target]{
        width:10px;height:10px;border-radius:50%;border:none;
        background:rgba(255,255,255,.4);opacity:1;
    }
    .carousel-indicators .active{background:#fff;transform:scale(1.2)}
</style>
</head>
<body>

<div class="carousel-wrap">

    <div id="homeSlider" class="carousel slide" data-bs-ride="carousel">

        <div class="carousel-inner">

            <div class="carousel-item active">
                <img src="slider1.jpeg" class="d-block w-100" alt="offer">
                <div class="carousel-caption">
                    <div class="caption-inner">
                        <h1>Big Offer</h1>
                        <p>Shop the best deals on phones, laptops & accessories.</p>
                        <a href="#" class="btn btn-success"><i class="fa-solid fa-bolt"></i> Shop Now</a>
                    </div>
                </div>
            </div>

            <div class="carousel-item">
                <img src="slider2.jpeg" class="d-block w-100" alt="Men's clothing">
                <div class="carousel-caption">
                    <div class="caption-inner">
                        <h1>Men's Clothing</h1>
                        <p>New season styles at unbeatable prices.</p>
                        <a href="#" class="btn btn-success"><i class="fa-solid fa-bolt"></i> Shop Now</a>
                    </div>
                </div>
            </div>

            <div class="carousel-item">
                <img src="slider3_4M3kc5Z.jpeg" class="d-block w-100" alt="Women's clothing">
                <div class="carousel-caption">
                    <div class="caption-inner">
                        <h1>Women's Clothing</h1>
                        <p>Elegant looks for every occasion.</p>
                        <a href="#" class="btn btn-success"><i class="fa-solid fa-bolt"></i> Shop Now</a>
                    </div>
                </div>
            </div>

        </div>

        <button class="carousel-control-prev" type="button" data-bs-target="#homeSlider" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>

        <button class="carousel-control-next" type="button" data-bs-target="#homeSlider" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
