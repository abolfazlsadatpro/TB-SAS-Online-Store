<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slider A — Glass Buttons</title>
<link rel="stylesheet" href="boot.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f4f7f5;padding:20px}
    .carousel-wrap{max-width:1300px;margin:0 auto;position:relative}

    /* ===== همون کاروسل — استایل دکمه‌ها ===== */
    .carousel-item img{height:600px;object-fit:cover;width:100%}

    /* ===== دکمه‌ها — Glass Circle ===== */
    .carousel-control-prev,.carousel-control-next{
        width:56px;height:56px;top:50%;transform:translateY(-50%);bottom:auto;
        background:rgba(255,255,255,.14);
        border:1.5px solid rgba(255,255,255,.45);
        -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
        border-radius:50%;opacity:1;margin:0 22px;
        transition:.25s;
    }
    .carousel-control-prev:hover,.carousel-control-next:hover{
        background:rgba(255,255,255,.32);border-color:#fff;
        transform:translateY(-50%) scale(1.08);
    }
    .carousel-control-prev-icon,
    .carousel-control-next-icon{
        width:26px;height:26px;
        filter:drop-shadow(0 2px 4px rgba(0,0,0,.25));
    }

    /* ===== متن — تمیز بدون باکس ===== */
    .carousel-caption{
        left:8%;right:auto;text-align:left;
        background:none;padding:0;border-radius:0;
        top:52%;transform:translateY(-50%);bottom:auto;
        max-width:480px;
    }
    .carousel-caption h1{
        font-size:44px;font-weight:800;letter-spacing:-.5px;
        text-shadow:0 4px 24px rgba(0,0,0,.4);margin-bottom:14px;
    }
    .carousel-caption p{
        font-size:17px;color:rgba(255,255,255,.95);line-height:1.75;
        text-shadow:0 2px 12px rgba(0,0,0,.4);margin-bottom:24px;
    }
    .carousel-caption .btn{
        display:inline-flex;align-items:center;gap:9px;
        background:#fff;color:#0a4d33;font-weight:800;padding:14px 30px;
        border-radius:8px;border:none;box-shadow:0 10px 26px -8px rgba(0,0,0,.35);
        transition:.2s;font-size:15px;
    }
    .carousel-caption .btn:hover{transform:translateY(-3px);background:#fff;color:#178a5b}
    .carousel-caption .btn i{font-size:14px}

    .carousel-indicators{bottom:18px}
    .carousel-indicators [data-bs-target]{
        width:10px;height:10px;border-radius:50%;border:none;
        background:rgba(255,255,255,.4);opacity:1;
    }
    .carousel-indicators .active{background:#fff;transform:scale(1.2)}
</style>
</head>
<body>

<div class="carousel-wrap">

    <div id="homeSlider" class="carousel slide" data-bs-ride="carousel">

        <div class="carousel-inner">

            <div class="carousel-item active">
                <img src="slider1.jpeg" class="d-block w-100" alt="offer">
                <div class="carousel-caption">
                    <h1>Big Offer</h1>
                    <p>Shop the best deals on phones, laptops & accessories.</p>
                    <a href="#" class="btn btn-success"><i class="fa-solid fa-bolt"></i> Shop Now</a>
                </div>
            </div>

            <div class="carousel-item">
                <img src="slider2.jpeg" class="d-block w-100" alt="Men's clothing">
                <div class="carousel-caption">
                    <h1>Men's Clothing</h1>
                    <p>New season styles at unbeatable prices.</p>
                    <a href="#" class="btn btn-success"><i class="fa-solid fa-bolt"></i> Shop Now</a>
                </div>
            </div>

            <div class="carousel-item">
                <img src="slider3_4M3kc5Z.jpeg" class="d-block w-100" alt="Women's clothing">
                <div class="carousel-caption">
                    <h1>Women's Clothing</h1>
                    <p>Elegant looks for every occasion.</p>
                    <a href="#" class="btn btn-success"><i class="fa-solid fa-bolt"></i> Shop Now</a>
                </div>
            </div>

        </div>

        <button class="carousel-control-prev" type="button" data-bs-target="#homeSlider" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>

        <button class="carousel-control-next" type="button" data-bs-target="#homeSlider" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
