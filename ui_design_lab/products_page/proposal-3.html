<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proposal 3 — Premium</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="shared/base.css">
<style>
/* ============================================================
   PROPOSAL 3 — PREMIUM
   Refined, spacious marketplace: serif display headings, warm
   neutrals + deep evergreen, soft image panels, gold rating,
   restrained shadows.
   ============================================================ */
body[data-proposal="3"] {
    background: #f6f5f1;
    font-family: "Inter", system-ui, -apple-system, sans-serif;
}

.p3 { --eg: #14532d; --eg-soft: #e6efe8; --gold: #c99a3f; --ink: #1f2937; --mut: #8a8f96; }
.p3 a { color: var(--eg); }

.p3-rule { max-width: 1280px; margin: 0 auto 6px; padding: 0 20px; }

.p3-crumb {
    font-size: 12.5px; color: var(--mut); letter-spacing: .3px;
    display: flex; gap: 9px; align-items: center; padding: 10px 0 22px;
}
.p3-crumb b { color: var(--ink); font-weight: 600; }

.p3-head {
    display: flex; align-items: flex-end; justify-content: space-between;
    border-bottom: 1px solid #e3e0d8; padding-bottom: 22px; margin-bottom: 26px; flex-wrap: wrap; gap: 14px;
}
.p3-head h1 { font-family: "Playfair Display", serif; font-size: 40px; font-weight: 600; margin: 0; color: #111827; letter-spacing: -.5px; }
.p3-head .sub { color: var(--mut); font-size: 14px; margin-top: 4px; }

.p3-acts { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 22px; }
.p3-acts .chip {
    display: inline-flex; align-items: center; gap: 8px; background: #fff; border: 1px solid #e3e0d8;
    color: var(--ink); font-size: 13px; font-weight: 500; padding: 8px 16px; border-radius: 999px;
}
.p3-acts .chip .rm { color: #b8b4ab; cursor: pointer; font-size: 16px; line-height: 1; }

.p3-shell { display: grid; grid-template-columns: 270px 1fr; gap: 40px; align-items: start; }

/* Sidebar */
.p3-aside { position: sticky; top: 88px; align-self: start; }
.p3-filters { background: transparent; }
.p3-fh { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
.p3-fh h3 { font-family: "Playfair Display", serif; font-size: 22px; font-weight: 600; margin: 0; }
.p3-fh a { font-size: 12.5px; color: var(--mut); text-decoration: underline; }
.p3-fh .cls { display: none; }
.p3-grp { border-top: 1px solid #e3e0d8; padding: 18px 0; }
.p3-grp:first-of-type { border-top: none; }
.p3-grp h4 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: #6b7280; }
.p3-opt { display: flex; align-items: center; gap: 12px; padding: 8px 0; font-size: 14.5px; color: #374151; cursor: pointer; }
.p3-opt input { accent-color: var(--eg); width: 17px; height: 17px; }
.p3-opt .n { margin-left: auto; color: #b8b4ab; font-size: 12.5px; }
.p3-swatch { display: flex; gap: 11px; flex-wrap: wrap; }
.p3-swatch span { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; box-shadow: 0 0 0 1px #e3e0d8; }
.p3-range { width: 100%; accent-color: var(--eg); height: 4px; }

/* Sort */
.p3-sort { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
.p3-sort button {
    background: transparent; border: none; padding: 8px 2px; margin-right: 16px;
    font-size: 13.5px; font-weight: 600; color: var(--mut); cursor: pointer;
    border-bottom: 2px solid transparent;
}
.p3-sort button.active { color: var(--eg); border-bottom-color: var(--eg); }
.p3-sort .res { margin-left: auto; font-size: 13px; color: var(--mut); }

/* Grid + cards */
.p3-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
.p3-card { display: flex; flex-direction: column; }
.p3-media {
    position: relative; border-radius: 18px; overflow: hidden; background: #efece4; aspect-ratio: 1 / 1;
    transition: box-shadow .3s;
}
.p3-card:hover .p3-media { box-shadow: 0 18px 44px -22px rgba(20,83,45,.35); }
.p3-media img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s ease; }
.p3-card:hover .p3-media img { transform: scale(1.04); }
.p3-badge {
    position: absolute; top: 14px; left: 14px; background: #fff; color: var(--eg);
    font-size: 11.5px; font-weight: 700; letter-spacing: .5px; padding: 5px 11px; border-radius: 999px;
}
.p3-badge.sale { color: #b91c1c; }
.p3-heart {
    position: absolute; top: 12px; right: 12px; width: 38px; height: 38px; border-radius: 50%;
    background: rgba(255,255,255,.9); border: none; color: #c4c0b6; cursor: pointer;
    display: grid; place-items: center; font-size: 16px; transition: color .15s, transform .15s;
}
.p3-heart:hover { transform: scale(1.08); }
.p3-heart.active { color: #dc2626; }
.p3-qv {
    position: absolute; left: 16px; right: 16px; bottom: 16px; background: #111827; color: #fff;
    border: none; border-radius: 999px; padding: 11px; font-size: 13px; font-weight: 600;
    opacity: 0; transform: translateY(6px); transition: opacity .25s, transform .25s; cursor: pointer;
}
.p3-card:hover .p3-qv { opacity: 1; transform: translateY(0); }

.p3-info { padding: 16px 6px 0; display: flex; flex-direction: column; gap: 6px; }
.p3-cat { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--mut); }
.p3-name { font-family: "Playfair Display", serif; font-size: 19px; font-weight: 600; margin: 0; color: #111827; line-height: 1.3; }
.p3-rate { display: flex; align-items: center; gap: 6px; color: var(--gold); font-size: 13px; }
.p3-rate .c { color: #b8b4ab; font-size: 12px; }
.p3-price { display: flex; align-items: baseline; gap: 10px; }
.p3-price .old { color: #b8b4ab; text-decoration: line-through; font-size: 13px; }
.p3-price .now { font-size: 20px; font-weight: 700; color: var(--eg); }
.p3-meta { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; color: var(--mut); }
.p3-meta .ok { color: var(--eg); font-weight: 600; }
.p3-meta .no { color: #b91c1c; font-weight: 600; }
.p3-colors { display: flex; gap: 6px; }
.p3-colors span { width: 13px; height: 13px; border-radius: 50%; box-shadow: 0 0 0 1px #ddd9ce; }

/* Pagination */
.p3-pages { display: flex; align-items: center; justify-content: center; gap: 22px; margin-top: 40px; }
.p3-pages .dots { color: #b8b4ab; }
.p3-pages button { background: none; border: none; font-family: "Playfair Display", serif; font-size: 16px; color: var(--mut); cursor: pointer; }
.p3-pages button.on { color: var(--eg); font-weight: 700; text-decoration: underline; text-underline-offset: 5px; }

/* Overlay/toggle/modal */
.p3-overlay { position: fixed; inset: 0; background: rgba(17,24,39,.4); z-index: 59; opacity: 0; pointer-events: none; transition: opacity .3s; }
.p3-overlay.show { opacity: 1; pointer-events: auto; }
.p3-toggle { display: none; position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 60; background: #111827; color: #fff; border: none; border-radius: 999px; padding: 14px 26px; font-weight: 600; font-size: 14px; cursor: pointer; box-shadow: 0 12px 30px rgba(0,0,0,.25); }
.p3-modal { position: fixed; inset: 0; background: rgba(17,24,39,.55); display: none; align-items: center; justify-content: center; z-index: 70; padding: 24px; }
.p3-modal.show { display: flex; }
.p3-modalbox { background: #fff; border-radius: 22px; width: 100%; max-width: 640px; overflow: hidden; }
.p3-modalhead { display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; border-bottom: 1px solid #efece4; font-family: "Playfair Display", serif; font-size: 20px; font-weight: 600; }
.p3-modalhead button { border: none; background: none; font-size: 22px; color: var(--mut); cursor: pointer; }
.p3-modalbody { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 24px; }
.p3-modalbody img { width: 100%; border-radius: 14px; }
.p3-modalbody h4 { font-family: "Playfair Display", serif; font-size: 22px; font-weight: 600; margin: 0 0 6px; }
.p3-modalbody .pr { color: var(--eg); font-weight: 700; font-size: 22px; margin: 12px 0; }
.p3-modalbody p { color: var(--mut); font-size: 14px; }

/* Skeleton */
.sk3 .ph { background: #efece4; border-radius: 18px; aspect-ratio: 1; }
.sk3 .ln { height: 15px; border-radius: 6px; background: #efece4; margin: 14px 0 0; }
.sk3 .ln.w { width: 55%; }
@keyframes p3pulse { 50% { opacity: .45; } }
.p3-pulse { animation: p3pulse 1.2s ease-in-out infinite; }

@media (max-width: 992px) {
    .p3-shell { grid-template-columns: 1fr; }
    .p3-aside { position: static; }
    .p3-filters {
        position: fixed; top: 0; right: 0; bottom: 0; width: 320px; max-width: 88%;
        background: #fff; padding: 24px; z-index: 60; transform: translateX(100%); transition: transform .3s; overflow-y: auto;
    }
    .p3-filters.open { transform: translateX(0); }
    .p3-fh .cls { display: block; }
    .p3-toggle { display: block; }
    .p3-grid { grid-template-columns: repeat(2, 1fr); gap: 20px; }
}
@media (max-width: 540px) {
    .p3-head h1 { font-size: 30px; }
    .p3-grid { grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .p3-name { font-size: 16px; }
    .p3-modalbody { grid-template-columns: 1fr; }
}
</style>
</head>
<body data-proposal="3">
<main class="lab-container">
    <div class="p3-rule">
        <nav class="p3-crumb">TB SAS Online Store <span>/</span> Digital <span>/</span> <b>Mobile Phones</b></nav>

        <div class="p3-head">
            <div>
                <h1>Mobile Phones</h1>
                <div class="sub"><span data-total-count>12</span> curated products</div>
            </div>
        </div>

        <div class="p3-acts" data-active-chips>
            <span data-chips-empty style="font-size:13px;color:#b8b4ab;display:none;">No active filters</span>
        </div>

        <div class="p3-shell">
            <aside class="p3-aside">
                <div class="p3-filters" data-filter-sidebar>
                    <div class="p3-fh"><h3>Refine</h3><a href="#">Clear all</a><button class="cls" data-drawer-close><i class="fa-solid fa-xmark"></i></button></div>

                    <div class="p3-grp">
                        <h4>Brand</h4>
                        <label class="p3-opt"><input type="checkbox" value="Apple" data-chip-filter> Apple <span class="n">2</span></label>
                        <label class="p3-opt"><input type="checkbox" value="Samsung" data-chip-filter> Samsung <span class="n">1</span></label>
                        <label class="p3-opt"><input type="checkbox" value="Xiaomi" data-chip-filter> Xiaomi <span class="n">3</span></label>
                        <label class="p3-opt"><input type="checkbox" value="Sony" data-chip-filter> Sony <span class="n">1</span></label>
                        <label class="p3-opt"><input type="checkbox" value="JBL" data-chip-filter> JBL <span class="n">1</span></label>
                    </div>

                    <div class="p3-grp">
                        <h4>Category</h4>
                        <label class="p3-opt"><input type="checkbox" value="Phone" data-chip-filter> Phones <span class="n">6</span></label>
                        <label class="p3-opt"><input type="checkbox" value="Laptop" data-chip-filter> Laptops <span class="n">4</span></label>
                        <label class="p3-opt"><input type="checkbox" value="Audio" data-chip-filter> Audio <span class="n">2</span></label>
                    </div>

                    <div class="p3-grp">
                        <h4>Price</h4>
                        <input class="p3-range" type="range" min="149" max="1399" value="1399">
                        <div style="display:flex;justify-content:space-between;font-size:12px;color:#b8b4ab;margin-top:8px;"><span>$149</span><span>$1,399</span></div>
                    </div>

                    <div class="p3-grp">
                        <h4>Colour</h4>
                        <div class="p3-swatch">
                            <span style="background:#1a1a1a"></span>
                            <span style="background:#c8c8c8"></span>
                            <span style="background:#3a5ba0"></span>
                            <span style="background:#dc2626"></span>
                            <span style="background:#ffd700"></span>
                        </div>
                    </div>
                </div>
            </aside>

            <div class="p3-overlay" data-overlay></div>

            <section>
                <div class="p3-sort">
                    <button data-sort class="active">Most Popular</button>
                    <button data-sort>Newest</button>
                    <button data-sort>Price Low–High</button>
                    <button data-sort>Price High–Low</button>
                    <span class="res">12 products</span>
                </div>

                <div class="p3-grid" data-products-grid></div>

                <nav class="p3-pages">
                    <button>Prev</button>
                    <button class="on">1</button>
                    <button>2</button>
                    <span class="dots">…</span>
                    <button>8</button>
                    <button>Next</button>
                </nav>

                <div style="margin-top:34px;text-align:center;">
                    <button data-demo-loading style="background:#111827;color:#fff;border:none;font-weight:600;padding:10px 20px;border-radius:999px;cursor:pointer;">Demo loading skeleton</button>
                </div>
            </section>
        </div>
    </div>
</main>

<button class="p3-toggle" data-drawer-open><i class="fa-solid fa-sliders"></i> Refine</button>

<div class="p3-modal" data-quickview-modal>
    <div class="p3-modalbox">
        <div class="p3-modalhead"><span>Quick View</span><button data-quickview-close><i class="fa-solid fa-xmark"></i></button></div>
        <div class="p3-modalbody">
            <img data-quickview-img src="">
            <div>
                <span class="p3-cat">Phone</span>
                <h4 data-quickview-title>Product name</h4>
                <div class="pr">$1,399</div>
                <p>Browse premium specifications, imagery and reviews on the product page.</p>
            </div>
        </div>
    </div>
</div>

<script src="shared/data.js"></script>
<script src="shared/header.js"></script>
<script src="shared/app.js"></script>
<script>
(function () {
    var grid = document.querySelector('[data-products-grid]');
    if (!grid || !window.PRODUCTS_DATA) return;
    function stars(r) {
        var b = window.starBreakdown(r), h = '';
        for (var i=0;i<b.full;i++) h += '<i class="fa-solid fa-star"></i>';
        if (b.half) h += '<i class="fa-solid fa-star-half-stroke"></i>';
        for (var j=0;j<b.empty;j++) h += '<i class="fa-regular fa-star"></i>';
        return h;
    }
    grid.innerHTML = window.PRODUCTS_DATA.map(function (p) {
        var colors = p.colors.map(function (c) { return '<span style="background:'+c.code+'"></span>'; }).join('');
        return '' +
        '<article class="p3-card">' +
          '<div class="p3-media">' +
            (p.discount ? '<span class="p3-badge sale">-'+p.discount+'%</span>' : '') +
            (p.is_new ? '<span class="p3-badge">New</span>' : '') +
            '<button class="p3-heart" data-wishlist><i class="fa-regular fa-heart"></i></button>' +
            '<img src="' + window.productImageURI(p) + '" alt="' + p.name + '" loading="lazy">' +
            '<button class="p3-qv" data-quickview="' + p.name + '" data-product-id="' + p.id + '">Quick View</button>' +
          '</div>' +
          '<div class="p3-info">' +
            '<span class="p3-cat">' + p.category + '</span>' +
            '<h3 class="p3-name">' + p.name + '</h3>' +
            '<div class="p3-rate">' + stars(p.rating) + ' <span class="c">' + p.rating_count + ' reviews</span></div>' +
            '<div class="p3-price">' +
              (p.old_price ? '<span class="old">$' + p.old_price + '</span>' : '') +
              '<span class="now">$' + p.price + '</span>' +
            '</div>' +
            '<div class="p3-meta">' +
              '<span class="' + (p.in_stock ? 'ok' : 'no') + '">' + (p.in_stock ? 'In Stock' : 'Out of Stock') + '</span>' +
              '<span class="p3-colors">' + colors + '</span>' +
            '</div>' +
          '</div>' +
        '</article>';
    }).join('');
})();
</script>
</body>
</html>
