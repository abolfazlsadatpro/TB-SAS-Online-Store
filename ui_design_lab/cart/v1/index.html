<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V1 — Clean Modern | Cart Design Lab</title>
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
/* =====================================================
   V1 — Clean Modern
   Philosophy: minimal, premium, spacious.
   Light background, soft cards, restrained accents.
   ===================================================== */

body { background: #f5f5f4; }

.pcl-v1-page { max-width: 1200px; margin: 0 auto; padding: 32px 20px 80px; }

.pcl-v1-breadcrumb {
  font-size: 13px; color: #6b7280; margin-bottom: 24px;
  display: flex; align-items: center; gap: 8px;
}
.pcl-v1-breadcrumb a { color: #6b7280; }
.pcl-v1-breadcrumb a:hover { color: #198754; }
.pcl-v1-breadcrumb .sep { color: #d1d5db; }
.pcl-v1-breadcrumb .last { color: #111827; font-weight: 500; }

.pcl-v1-header {
  display: flex; justify-content: space-between; align-items: flex-end;
  margin-bottom: 32px; flex-wrap: wrap; gap: 12px;
}
.pcl-v1-header h1 {
  font-size: 32px; font-weight: 700; color: #111827;
  letter-spacing: -.5px; margin: 0;
}
.pcl-v1-header .sub {
  font-size: 14px; color: #6b7280; margin-top: 4px;
}

.pcl-v1-layout {
  display: grid; grid-template-columns: 1fr 380px;
  gap: 32px; align-items: start;
}

.pcl-v1-items { display: flex; flex-direction: column; gap: 16px; }

.pcl-v1-card {
  background: #fff;
  border: 1px solid #f0f0ef;
  border-radius: 16px;
  padding: 20px;
  display: grid;
  grid-template-columns: 96px 1fr 160px 120px 40px;
  gap: 20px;
  align-items: center;
  transition: box-shadow .2s ease, border-color .2s ease;
}
.pcl-v1-card:hover {
  border-color: #e5e7eb;
  box-shadow: 0 4px 16px rgba(0, 0, 0, .04);
}
.pcl-v1-card.is-out { opacity: .7; }
.pcl-v1-card.is-loading { opacity: .55; pointer-events: none; }

.pcl-v1-image {
  width: 96px; height: 96px; border-radius: 12px;
  background: #fafafa; padding: 8px; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.pcl-v1-image img { width: 100%; height: 100%; object-fit: contain; }
.pcl-v1-image .placeholder {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  color: #d1d5db; font-size: 24px;
}

.pcl-v1-info { min-width: 0; }
.pcl-v1-name {
  font-size: 15px; font-weight: 600; color: #111827;
  margin: 0 0 4px; line-height: 1.35;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}
.pcl-v1-name a { color: inherit; }
.pcl-v1-name a:hover { color: #198754; }
.pcl-v1-meta {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  font-size: 12px; color: #6b7280; margin-bottom: 6px;
}
.pcl-v1-color-dot {
  width: 12px; height: 12px; border-radius: 50%;
  border: 1px solid #e5e7eb; flex-shrink: 0;
}
.pcl-v1-stock {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; color: #16a34a; font-weight: 500;
}
.pcl-v1-stock.is-out { color: #dc2626; }
.pcl-v1-price-line {
  font-size: 12px; color: #9ca3af; margin-top: 2px;
}
.pcl-v1-price-line .was {
  text-decoration: line-through; margin-right: 6px;
}

.pcl-v1-qty {
  display: flex; align-items: center; border: 1px solid #e5e7eb;
  border-radius: 10px; background: #fff; overflow: hidden;
  height: 40px;
}
.pcl-v1-qty button {
  width: 36px; height: 100%; color: #4b5563; font-size: 16px;
  font-weight: 500; background: #fff;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s ease;
}
.pcl-v1-qty button:hover { background: #f9fafb; }
.pcl-v1-qty button:disabled { opacity: .4; cursor: not-allowed; }
.pcl-v1-qty .value {
  min-width: 40px; text-align: center; font-size: 14px;
  font-weight: 600; color: #111827;
  border-left: 1px solid #e5e7eb; border-right: 1px solid #e5e7eb;
  height: 100%; display: flex; align-items: center; justify-content: center;
}

.pcl-v1-total {
  text-align: right; font-size: 16px; font-weight: 700; color: #111827;
}

.pcl-v1-remove {
  width: 36px; height: 36px; border-radius: 10px;
  color: #9ca3af; transition: all .15s ease;
  display: flex; align-items: center; justify-content: center;
}
.pcl-v1-remove:hover { background: #fef2f2; color: #dc2626; }

.pcl-v1-coupon {
  background: #fff; border: 1px solid #f0f0ef; border-radius: 16px;
  padding: 20px; margin-top: 20px;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.pcl-v1-coupon .label {
  font-size: 13px; font-weight: 600; color: #374151; margin-right: 4px;
}
.pcl-v1-coupon input {
  flex: 1; min-width: 160px; height: 44px; padding: 0 14px;
  border: 1px solid #e5e7eb; border-radius: 10px; font-size: 14px;
  color: #111827; outline: none; background: #fafafa;
  transition: border-color .15s ease, background .15s ease;
}
.pcl-v1-coupon input:focus { border-color: #198754; background: #fff; }
.pcl-v1-coupon .apply {
  height: 44px; padding: 0 22px; border-radius: 10px;
  background: #111827; color: #fff; font-weight: 600; font-size: 14px;
  transition: background .15s ease;
}
.pcl-v1-coupon .apply:hover { background: #1f2937; }
.pcl-v1-coupon .apply:disabled { opacity: .5; cursor: not-allowed; }
.pcl-v1-coupon-applied {
  display: none; align-items: center; gap: 10px;
  background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 10px;
  padding: 8px 12px; font-size: 13px; color: #166534; font-weight: 600;
}
.pcl-v1-coupon-applied.is-show { display: inline-flex; }
.pcl-v1-coupon-applied .code {
  background: #fff; border: 1px solid #bbf7d0; padding: 2px 8px;
  border-radius: 6px; font-family: ui-monospace, monospace;
}
.pcl-v1-coupon-applied .remove {
  margin-left: 8px; color: #16a34a; cursor: pointer; font-size: 12px;
}
.pcl-v1-coupon-applied .remove:hover { color: #dc2626; }

.pcl-v1-summary {
  background: #fff; border: 1px solid #f0f0ef; border-radius: 16px;
  padding: 24px; position: sticky; top: 70px;
}
.pcl-v1-summary h3 {
  margin: 0 0 20px; font-size: 18px; font-weight: 700; color: #111827;
}
.pcl-v1-summary .row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 0; font-size: 14px; color: #4b5563;
}
.pcl-v1-summary .row.discount { color: #16a34a; }
.pcl-v1-summary .row .free { color: #16a34a; font-weight: 600; }
.pcl-v1-summary hr { border: 0; border-top: 1px solid #f3f4f6; margin: 8px 0; }
.pcl-v1-summary .total {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 0 8px; font-size: 16px; font-weight: 600; color: #111827;
}
.pcl-v1-summary .total .amount { font-size: 22px; font-weight: 700; }
.pcl-v1-summary .checkout {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; height: 52px; margin-top: 16px; border-radius: 12px;
  background: #198754; color: #fff; font-size: 15px; font-weight: 700;
  letter-spacing: .3px; text-decoration: none;
  transition: background .15s ease;
}
.pcl-v1-summary .checkout:hover { background: #157347; }
.pcl-v1-summary .continue {
  display: block; text-align: center; margin-top: 12px;
  font-size: 13px; color: #6b7280; text-decoration: none;
}
.pcl-v1-summary .continue:hover { color: #198754; }

/* Empty state */
.pcl-v1-empty {
  background: #fff; border: 1px solid #f0f0ef; border-radius: 20px;
  padding: 64px 24px; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
}
.pcl-v1-empty .icon {
  width: 80px; height: 80px; border-radius: 50%;
  background: #f0f9f3; color: #198754; display: flex;
  align-items: center; justify-content: center; font-size: 36px;
  margin-bottom: 6px;
}
.pcl-v1-empty h3 { font-size: 22px; font-weight: 700; color: #111827; margin: 0; }
.pcl-v1-empty p { font-size: 14px; color: #6b7280; margin: 0; max-width: 320px; }
.pcl-v1-empty .action {
  margin-top: 16px; display: inline-flex; align-items: center; gap: 8px;
  height: 44px; padding: 0 24px; border-radius: 10px;
  background: #198754; color: #fff; font-size: 14px; font-weight: 600;
  text-decoration: none; transition: background .15s ease;
}
  .pcl-v1-empty .action:hover { background: #157347; }

.visually-hidden {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}

@media (max-width: 1024px) {
  .pcl-v1-layout { grid-template-columns: 1fr; }
  .pcl-v1-summary { position: static; }
}
@media (max-width: 720px) {
  .pcl-v1-card {
    grid-template-columns: 80px 1fr 36px;
    grid-template-rows: auto auto auto;
    grid-template-areas:
      "img info remove"
      "img qty total"
      "img meta meta";
    gap: 10px;
  }
  .pcl-v1-image { grid-area: img; width: 80px; height: 80px; }
  .pcl-v1-info { grid-area: info; }
  .pcl-v1-remove { grid-area: remove; align-self: start; }
  .pcl-v1-qty { grid-area: qty; justify-self: start; }
  .pcl-v1-total { grid-area: total; text-align: right; }
  .pcl-v1-meta { grid-area: meta; }
  .pcl-v1-coupon { flex-direction: column; align-items: stretch; }
  .pcl-v1-coupon .apply { width: 100%; }
}
</style>
</head>
<body>

<div class="pcl-lab-bar">
  <div>
    <span class="lab-tag">V1</span>
    <span class="lab-title" style="margin-left:8px">Clean Modern</span>
  </div>
  <a href="../index.html" class="lab-back">← Back to Lab</a>
</div>

<div class="pcl-v1-page">

  <div class="pcl-v1-breadcrumb">
    <a href="#">Home</a><span class="sep">/</span>
    <span class="last">Shopping Cart</span>
  </div>

  <div class="pcl-v1-header">
    <div>
      <h1>Shopping Cart</h1>
      <div class="sub" id="v1-subtitle">3 products in your cart</div>
    </div>
  </div>

  <div class="pcl-v1-layout">

    <div>
      <div class="pcl-v1-items" id="v1-items">
        <!-- Items rendered by JS -->
      </div>

      <div class="pcl-v1-coupon">
        <div class="label">Have a coupon code?</div>
        <label class="visually-hidden" for="v1-coupon-input">Coupon code</label>
        <input id="v1-coupon-input" placeholder="Enter code" aria-label="Coupon code">
        <button type="button" class="apply" id="v1-coupon-apply">Apply</button>
        <div class="pcl-v1-coupon-applied" id="v1-coupon-applied" role="status" aria-live="polite">
          <i class="fa-solid fa-check-circle"></i>
          Coupon <span class="code" id="v1-applied-code"></span> applied
          <button type="button" class="remove" id="v1-coupon-remove">Remove</button>
        </div>
      </div>
    </div>

    <aside class="pcl-v1-summary" aria-label="Order summary">
      <h3>Order Summary</h3>
      <div class="row"><span>Subtotal</span><span id="v1-subtotal">$0.00</span></div>
      <div class="row discount" id="v1-discount-row" style="display:none">
        <span>Discount <em id="v1-discount-code" style="font-style:normal;font-size:11px;background:#dcfce7;color:#166534;padding:2px 6px;border-radius:4px;margin-left:6px"></em></span>
        <span id="v1-discount">-$0.00</span>
      </div>
      <div class="row"><span>Shipping</span><span class="free" id="v1-shipping">Free</span></div>
      <div class="row"><span>Tax (10%)</span><span id="v1-tax">$0.00</span></div>
      <hr>
      <div class="total"><span>Total</span><span class="amount" id="v1-total">$0.00</span></div>
      <a href="#" class="checkout"><i class="fa-solid fa-lock" style="font-size:12px"></i> Secure Checkout</a>
      <a href="#" class="continue">Continue Shopping</a>
    </aside>

  </div>

</div>

<div class="pcl-toast" id="v1-toast" role="status" aria-live="polite"></div>

<script src="../shared/data.js"></script>
<script src="cart.js"></script>

</body>
</html>
