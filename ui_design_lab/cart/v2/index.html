<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V2 — Audit Driven | Cart Design Lab</title>
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
/* =====================================================
   V2 — Audit Driven
   Philosophy: functional, honest, complete.
   Every audit gap addressed: stock state, quantity input,
   remove confirmation, coupon chip, accessible labels,
   mobile-first hierarchy.
   ===================================================== */

body { background: var(--bg); }

.pcl-v2-page { max-width: 1200px; margin: 0 auto; padding: 24px 20px 80px; }

.pcl-v2-breadcrumb {
  font-size: 13px; color: var(--muted); margin-bottom: 16px;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.pcl-v2-breadcrumb a { color: var(--muted); }
.pcl-v2-breadcrumb a:hover { color: var(--green); }
.pcl-v2-breadcrumb .sep { color: #cbd5e1; }
.pcl-v2-breadcrumb .last { color: var(--ink); font-weight: 500; }

.pcl-v2-header {
  margin-bottom: 20px;
}
.pcl-v2-header h1 {
  font-size: 28px; font-weight: 700; color: var(--ink);
  margin: 0 0 4px;
}
.pcl-v2-header .sub {
  font-size: 14px; color: var(--muted);
}

.pcl-v2-layout {
  display: grid; grid-template-columns: 1fr 360px;
  gap: 24px; align-items: start;
}

/* Items list */
.pcl-v2-items { display: flex; flex-direction: column; gap: 12px; }

.pcl-v2-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  display: grid;
  grid-template-columns: 88px 1fr auto;
  gap: 16px;
  align-items: flex-start;
  position: relative;
  transition: box-shadow .15s ease, border-color .15s ease, opacity .15s ease;
}
.pcl-v2-card:hover { border-color: #d1d5db; box-shadow: 0 1px 4px rgba(0, 0, 0, .04); }
.pcl-v2-card.is-out { background: #f9fafb; }
.pcl-v2-card.is-out .pcl-v2-name a { color: #6b7280; text-decoration: line-through; }
.pcl-v2-card.is-loading { opacity: .55; pointer-events: none; }
.pcl-v2-card .pcl-v2-disabled-overlay {
  position: absolute; inset: 0; display: none;
}
.pcl-v2-card.is-out .pcl-v2-disabled-overlay { display: block; cursor: not-allowed; }

.pcl-v2-image {
  width: 88px; height: 88px; border-radius: 10px;
  background: #f8f8f7; padding: 6px; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.pcl-v2-image img { width: 100%; height: 100%; object-fit: contain; }
.pcl-v2-image .ph { color: #d1d5db; font-size: 22px; }

.pcl-v2-info { min-width: 0; }
.pcl-v2-name {
  font-size: 15px; font-weight: 600; color: var(--ink);
  margin: 0 0 4px; line-height: 1.35;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}
.pcl-v2-name a { color: inherit; }
.pcl-v2-name a:hover { color: var(--green); }

.pcl-v2-attr {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  font-size: 12px; color: var(--muted); margin-bottom: 4px;
}
.pcl-v2-color-dot {
  width: 12px; height: 12px; border-radius: 50%;
  border: 1px solid #e5e7eb; flex-shrink: 0;
}

.pcl-v2-meta {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  font-size: 11px; margin-top: 4px;
}
.pcl-v2-stock {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 12px;
  font-weight: 600; font-size: 10px; letter-spacing: .3px; text-transform: uppercase;
}
.pcl-v2-stock.in { background: #dcfce7; color: #166534; }
.pcl-v2-stock.out { background: #fee2e2; color: #991b1b; }

.pcl-v2-price-now {
  font-size: 14px; font-weight: 700; color: var(--ink);
}
.pcl-v2-price-was {
  text-decoration: line-through; color: #9ca3af; font-size: 12px; margin-right: 6px;
}

.pcl-v2-actions {
  display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
  min-width: 120px;
}
.pcl-v2-qty {
  display: flex; align-items: stretch; border: 1px solid var(--line);
  border-radius: 8px; background: #fff; overflow: hidden;
  height: 36px; width: fit-content;
}
.pcl-v2-qty button {
  width: 32px; height: 100%; background: #fff; color: var(--ink-2);
  font-size: 16px; font-weight: 500;
  display: flex; align-items: center; justify-content: center;
}
.pcl-v2-qty button:hover { background: #f3f4f6; }
.pcl-v2-qty button:disabled { opacity: .4; cursor: not-allowed; }
.pcl-v2-qty input {
  width: 44px; height: 100%; border: 0; outline: none;
  text-align: center; font-size: 14px; font-weight: 600; color: var(--ink);
  border-left: 1px solid var(--line); border-right: 1px solid var(--line);
  background: #fff; -moz-appearance: textfield;
}
.pcl-v2-qty input::-webkit-outer-spin-button,
.pcl-v2-qty input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

.pcl-v2-line-total {
  font-size: 14px; font-weight: 700; color: var(--ink);
  text-align: right; min-width: 64px;
}

.pcl-v2-controls {
  display: flex; align-items: center; gap: 4px;
}
.pcl-v2-remove {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 8px; border-radius: 6px;
  color: var(--danger); font-size: 11px; font-weight: 600;
  transition: background .15s ease;
}
.pcl-v2-remove:hover { background: #fef2f2; }
.pcl-v2-remove i { font-size: 12px; }

/* Coupon block */
.pcl-v2-coupon {
  background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px; margin-top: 16px;
}
.pcl-v2-coupon h4 {
  font-size: 13px; font-weight: 700; color: var(--ink); margin: 0 0 8px;
  display: flex; align-items: center; gap: 6px;
}
.pcl-v2-coupon-form {
  display: flex; gap: 8px; align-items: stretch;
}
.pcl-v2-coupon-form input {
  flex: 1; min-width: 0; height: 40px; padding: 0 12px;
  border: 1px solid var(--line); border-radius: 8px;
  font-size: 13px; color: var(--ink); background: #fafafa; outline: none;
  text-transform: uppercase; font-family: ui-monospace, monospace;
  transition: border-color .15s ease;
}
.pcl-v2-coupon-form input:focus { border-color: var(--green); background: #fff; }
.pcl-v2-coupon-form button {
  height: 40px; padding: 0 18px; border-radius: 8px;
  background: var(--ink); color: #fff; font-weight: 600; font-size: 13px;
  transition: background .15s ease; min-width: 80px;
}
.pcl-v2-coupon-form button:hover { background: #1f2937; }
.pcl-v2-coupon-form button:disabled { opacity: .5; cursor: not-allowed; }
.pcl-v2-coupon-error {
  margin-top: 6px; font-size: 12px; color: var(--danger);
  display: none; align-items: center; gap: 4px;
}
.pcl-v2-coupon-error.is-show { display: flex; }
.pcl-v2-coupon-applied {
  display: none; align-items: center; gap: 10px;
  background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px;
  padding: 8px 12px; font-size: 13px; color: #166534; font-weight: 600;
}
.pcl-v2-coupon-applied.is-show { display: flex; }
.pcl-v2-coupon-applied .code {
  font-family: ui-monospace, monospace; background: #fff;
  border: 1px solid #bbf7d0; padding: 2px 8px; border-radius: 4px;
}
.pcl-v2-coupon-applied .remove {
  margin-left: auto; color: #16a34a; font-size: 12px;
  text-decoration: underline; font-weight: 600;
}
.pcl-v2-coupon-applied .remove:hover { color: var(--danger); }

/* Summary */
.pcl-v2-summary {
  background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
  padding: 24px; position: sticky; top: 70px;
}
.pcl-v2-summary h3 {
  font-size: 16px; font-weight: 700; color: var(--ink); margin: 0 0 16px;
}
.pcl-v2-summary .row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 0; font-size: 14px; color: #4b5563;
}
.pcl-v2-summary .row .label { color: var(--ink-2); }
.pcl-v2-summary .row .value { font-weight: 500; }
.pcl-v2-summary .row .free { color: #16a34a; font-weight: 600; }
.pcl-v2-summary .row .discount { color: #16a34a; font-weight: 600; }
.pcl-v2-summary hr { border: 0; border-top: 1px solid var(--line); margin: 8px 0; }
.pcl-v2-summary .total {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 0; font-size: 14px; font-weight: 600; color: var(--ink);
}
.pcl-v2-summary .total .amount { font-size: 20px; font-weight: 700; }
.pcl-v2-summary .note {
  font-size: 12px; color: var(--muted); text-align: center; margin: 12px 0 0;
}
.pcl-v2-summary .checkout {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; height: 50px; margin-top: 16px; border-radius: 10px;
  background: var(--green); color: #fff; font-size: 15px; font-weight: 700;
  text-decoration: none;
  transition: background .15s ease;
}
.pcl-v2-summary .checkout:hover { background: var(--green-dark); }
.pcl-v2-summary .continue {
  display: block; text-align: center; margin-top: 10px;
  font-size: 13px; color: var(--muted); text-decoration: none;
}
.pcl-v2-summary .continue:hover { color: var(--green); }

/* Empty */
.pcl-v2-empty {
  background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
  padding: 64px 24px; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
}
.pcl-v2-empty .icon {
  width: 72px; height: 72px; border-radius: 50%;
  background: var(--green-soft); color: var(--green);
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; margin-bottom: 4px;
}
.pcl-v2-empty h3 { font-size: 20px; font-weight: 700; color: var(--ink); margin: 0; }
.pcl-v2-empty p { font-size: 13px; color: var(--muted); margin: 0; max-width: 320px; }
.pcl-v2-empty .action {
  margin-top: 16px; display: inline-flex; align-items: center; gap: 8px;
  height: 42px; padding: 0 22px; border-radius: 8px;
  background: var(--green); color: #fff; font-size: 14px; font-weight: 600;
  text-decoration: none; transition: background .15s ease;
}
.pcl-v2-empty .action:hover { background: var(--green-dark); }

@media (max-width: 1024px) {
  .pcl-v2-layout { grid-template-columns: 1fr; }
  .pcl-v2-summary { position: static; }
}
@media (max-width: 640px) {
  .pcl-v2-card {
    grid-template-columns: 72px 1fr;
    grid-template-rows: auto auto;
    grid-template-areas:
      "img info"
      "actions actions";
    gap: 12px;
  }
  .pcl-v2-image { grid-area: img; width: 72px; height: 72px; }
  .pcl-v2-info { grid-area: info; }
  .pcl-v2-actions {
    grid-area: actions;
    flex-direction: row; justify-content: space-between; align-items: center;
    border-top: 1px dashed var(--line); padding-top: 12px;
    min-width: 0;
  }
  .pcl-v2-line-total { font-size: 16px; }
}
</style>
</head>
<body>

<div class="pcl-lab-bar">
  <div>
    <span class="lab-tag">V2</span>
    <span class="lab-title" style="margin-left:8px">Audit Driven</span>
  </div>
  <a href="../index.html" class="lab-back">← Back to Lab</a>
</div>

<div class="pcl-v2-page">

  <div class="pcl-v2-breadcrumb">
    <a href="#">Home</a><span class="sep">/</span>
    <span class="last">Shopping Cart</span>
  </div>

  <div class="pcl-v2-header">
    <h1>Shopping Cart</h1>
    <div class="sub" id="v2-subtitle">3 products · 4 items</div>
  </div>

  <div class="pcl-v2-layout">
    <div>
      <div class="pcl-v2-items" id="v2-items"></div>
      <div class="pcl-v2-coupon" id="v2-coupon-block">
        <h4><i class="fa-solid fa-tag"></i> Have a coupon code?</h4>
        <form class="pcl-v2-coupon-form" id="v2-coupon-form" onsubmit="return false">
          <label class="visually-hidden" for="v2-coupon-input">Coupon code</label>
          <input id="v2-coupon-input" placeholder="Enter code" aria-label="Coupon code">
          <button type="submit" id="v2-coupon-apply">Apply</button>
        </form>
        <div class="pcl-v2-coupon-applied" id="v2-coupon-applied" role="status" aria-live="polite">
          <i class="fa-solid fa-check-circle"></i>
          Coupon <span class="code" id="v2-applied-code"></span> applied — <span id="v2-applied-savings"></span> off
          <button type="button" class="remove" id="v2-coupon-remove">Remove</button>
        </div>
        <div class="pcl-v2-coupon-error" id="v2-coupon-error" role="alert">
          <i class="fa-solid fa-circle-exclamation"></i>
          <span id="v2-coupon-error-msg"></span>
        </div>
      </div>
    </div>

    <aside class="pcl-v2-summary" aria-label="Order summary">
      <h3>Order Summary</h3>
      <div class="row"><span class="label">Items (<span id="v2-count">0</span>)</span><span class="value" id="v2-subtotal">$0.00</span></div>
      <div class="row" id="v2-discount-row" style="display:none">
        <span class="label">Discount</span><span class="discount" id="v2-discount">-$0.00</span>
      </div>
      <div class="row"><span class="label">Shipping</span><span class="free" id="v2-shipping">Free</span></div>
      <div class="row"><span class="label">Tax (10%)</span><span class="value" id="v2-tax">$0.00</span></div>
      <hr>
      <div class="total"><span>Total</span><span class="amount" id="v2-total">$0.00</span></div>
      <p class="note">Tax and shipping calculated at checkout</p>
      <a href="#" class="checkout"><i class="fa-solid fa-arrow-right"></i> Proceed to Checkout</a>
      <a href="#" class="continue">Continue Shopping</a>
    </aside>
  </div>

</div>

<div class="pcl-toast" id="v2-toast" role="status" aria-live="polite"></div>

<style>
.visually-hidden {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}
</style>

<script src="../shared/data.js"></script>
<script src="cart.js"></script>
</body>
</html>
